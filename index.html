<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.twelvedata.com https://www.alphavantage.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Lydia</title>
<meta name="theme-color" content="#EEF1F6">
<style>
/* Layout: app a una colonna stile One UI (titolo grande in alto, contenuto a portata di pollice, barra in basso), superfici in vetro e angoli vivi */
:root{
  --bg:#EEF1F6; --blob1:#BFD3FF; --blob2:#CDEBDD; --blob3:#F3D9E4;
  --ink:#141A24; --muted:#5D6778; --faint:#8A93A3;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(20,30,50,.09); --glass-hi:rgba(255,255,255,.7);
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(47,107,255,.12);
  --pos:#14915A; --neg:#D93D44; --warn:#B87400; --info:#2F6BFF;
  --c1:#2F6BFF; --c2:#14A37F; --c3:#E08A1E; --c4:#C2417A; --c5:#7A5AE0; --c6:#2BA3C9; --c7:#8B9A2E; --c8:#9AA3B2;
  --shadow:0 10px 30px rgba(20,30,60,.08);
  --font:'SamsungOne','Samsung Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --gold:#B8912E; --gold-ink:#7A5C10; --gold-soft:rgba(212,175,55,.16); --gold-grad:linear-gradient(135deg,#ecdba5 0%,#D4AF37 38%,#a08429 62%,#D4AF37 82%,#e7d391 100%);
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --gold:#E3BC4A; --gold-ink:#E3BC4A; --gold-soft:rgba(227,188,74,.16);
  --bg:#0A0D13; --blob1:#16306E; --blob2:#0F3B2E; --blob3:#3A1630;
  --ink:#EAEFF7; --muted:#9AA5B8; --faint:#6D778A;
  --glass:rgba(24,29,40,.58); --glass-strong:rgba(22,27,37,.9); --glass-line:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.06);
  --accent:#6B9BFF; --accent-ink:#0A0D13; --accent-soft:rgba(107,155,255,.16);
  --pos:#43C98A; --neg:#FF6B70; --warn:#F2B441; --info:#6B9BFF;
  --c1:#6B9BFF; --c2:#3FCFA4; --c3:#F2A54A; --c4:#EE76A8; --c5:#A48CFF; --c6:#5CC6E8; --c7:#B9C85A; --c8:#7F8899;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --gold:#E3BC4A; --gold-ink:#E3BC4A; --gold-soft:rgba(227,188,74,.16);
  --bg:#0A0D13; --blob1:#16306E; --blob2:#0F3B2E; --blob3:#3A1630;
  --ink:#EAEFF7; --muted:#9AA5B8; --faint:#6D778A;
  --glass:rgba(24,29,40,.58); --glass-strong:rgba(22,27,37,.9); --glass-line:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.06);
  --accent:#6B9BFF; --accent-ink:#0A0D13; --accent-soft:rgba(107,155,255,.16);
  --pos:#43C98A; --neg:#FF6B70; --warn:#F2B441; --info:#6B9BFF;
  --c1:#6B9BFF; --c2:#3FCFA4; --c3:#F2A54A; --c4:#EE76A8; --c5:#A48CFF; --c6:#5CC6E8; --c7:#B9C85A; --c8:#7F8899;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;width:70vmax;height:70vmax;filter:blur(60px);opacity:.75;border-radius:50%}
.bgfx i:nth-child(1){background:var(--blob1);top:-30vmax;left:-20vmax}
.bgfx i:nth-child(2){background:var(--blob2);top:20vh;right:-35vmax}
.bgfx i:nth-child(3){background:var(--blob3);bottom:-40vmax;left:-10vmax;opacity:.5}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra in alto */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;height:56px}
.topbar .small{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:1.05rem;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.topbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid var(--glass-line)}
.topbar.scrolled .small{opacity:1;transform:none}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{position:relative;z-index:1;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
.bigtitle{padding:22px 2px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.bigtitle h1{font-size:2.35rem;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.bigtitle p{margin:8px 0 0;color:var(--muted);max-width:52ch}

section.blk{margin:0 0 14px}
.card{padding:16px}
.card h2{font-size:1rem;font-weight:700;margin:0;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:.84rem;margin:2px 0 0}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lab{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.02em}
.eyebrow{color:var(--gold-ink);font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.note{color:var(--muted);font-size:.84rem;margin:0}

/* segmenti */
.seg{display:flex;padding:3px;gap:3px;border:1px solid var(--glass-line);background:var(--glass)}
.filters .seg{overflow-x:auto;scrollbar-width:none}.filters .seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 10px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#ftype button[data-v="out"][aria-pressed="true"]{background:var(--neg);color:var(--bg)}
#ftype button[data-v="in"][aria-pressed="true"]{background:var(--pos);color:var(--bg)}
#ftype button[data-v="tr"][aria-pressed="true"]{background:var(--gold-grad);color:#0B1020}
#ftype button[data-v="inv"][aria-pressed="true"]{background:var(--c5);color:#fff}
.pernav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.pernav b{font-size:1rem;text-transform:capitalize}
.pernav button{width:40px;height:40px;border:1px solid var(--glass-line);background:var(--glass);font-size:1.2rem}
.pernav button:disabled{opacity:.35;cursor:default}

/* hero */
.hero{padding:20px 18px;border-top:2px solid transparent;border-image:var(--gold-grad) 1}
.hero .big{font-size:2.5rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 2px}
.hero .meta{color:var(--muted);font-size:.86rem}
.split{display:flex;height:10px;margin:14px 0 4px;gap:2px;background:var(--glass-line)}
.split i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:619px){.tiles.t3>:last-child:nth-child(3){grid-column:span 2}}
@media (min-width:620px){.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{padding:14px;min-width:0}
.tile .v{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:.78rem;font-weight:600;margin-top:2px;color:var(--muted)}
.chart{position:relative;height:240px}
.chart.sm{height:200px}.chart.lg{height:280px}
.legend{margin-top:10px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--glass-line);font-size:.9rem}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;flex:none}
.bar{height:6px;background:var(--glass-line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold-grad)}

/* liste */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--glass-line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap}
.ico{width:36px;height:36px;display:grid;place-items:center;flex:none;font-weight:800;font-size:.8rem;color:#fff}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:.88rem}
.grouphead b{text-transform:capitalize}

/* tabelle */
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--glass-line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:.76rem;letter-spacing:.02em}
tr:last-child td{border-bottom:0}

/* consigli */
.tip{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--glass-line)}
.tip:last-child{border-bottom:0}
.tip .stripe{width:4px;flex:none}
.tip .tt{font-weight:800}
.tip .tx{color:var(--muted);font-size:.88rem;margin-top:3px}
.tip .act{margin-top:10px}
.chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;margin-bottom:6px}
.lv-act .stripe{background:var(--gold-grad)} .lv-act .chip{background:var(--gold-soft);color:var(--gold-ink)}
.lv-warn .stripe{background:var(--warn)} .lv-warn .chip{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.lv-bad .stripe{background:var(--neg)} .lv-bad .chip{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.lv-good .stripe{background:var(--pos)} .lv-good .chip{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.lv-info .stripe{background:var(--faint)} .lv-info .chip{background:var(--glass-line);color:var(--muted)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;padding:11px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--glass);color:var(--ink);border-color:var(--glass-line)}
.btn.danger{background:none;color:var(--neg);border-color:var(--neg)}
.btn.dangerfill{background:var(--neg);color:#fff}
.btn.gold{background:var(--gold-grad);color:#0B1020;border-color:transparent}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.brand svg{flex:none}
.brand{flex:none}.topbar .iconbtn{flex:none}
@media (max-width:420px){.topbar .in{gap:6px}.topbar .iconbtn{width:38px;height:38px}.topbar .small{display:none}.brand{margin-right:auto}}
@media (max-width:350px){.brand .ver{display:none}}
.brand .ver{font-size:.68rem;font-weight:700;color:var(--gold-ink);border:1px solid var(--gold);padding:1px 5px;letter-spacing:.02em}
.goldline{border-top:2px solid transparent;border-image:var(--gold-grad) 1}
.iconbtn{position:relative}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;background:var(--neg);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center}
.ct{font:600 11px var(--font);fill:var(--muted)}
.cv{height:100%}
.cro{position:absolute;top:0;left:0;background:var(--ink);color:var(--bg);padding:8px 10px;font-size:.78rem;line-height:1.5;pointer-events:none;z-index:3;max-width:230px}
.cro .sw{display:inline-block;margin-right:6px;vertical-align:-1px}
.clg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:6px}
.clg .sw{display:inline-block;margin-right:5px;vertical-align:-1px}
.acc-card{padding:16px;margin-bottom:12px}
.acc-card .bal{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.priv{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--glass-line)}
.resbox{margin-top:14px;padding:14px;border:1px solid var(--glass-line);background:var(--gold-soft)}
.resbox .big{font-size:2rem;font-weight:800;letter-spacing:-.03em;color:var(--gold-ink)}
.acc-card .spk{margin-top:10px}
.acc-card .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acc-card .sw{width:12px;height:12px;display:inline-block;margin-top:6px}
.pdfrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--glass-line)}
.pdfrow input{margin-top:4px;width:18px;height:18px;accent-color:var(--gold)}
.welcome{display:flex;gap:16px;align-items:center;margin:8px 0 18px}
.welcome svg{flex:none;box-shadow:0 8px 24px rgba(160,132,41,.35)}
.welcome h1{margin:0;font-size:1.9rem;letter-spacing:-.03em;line-height:1.1}
.welcome p{margin:4px 0 0;color:var(--muted)}
.step{display:flex;gap:14px;align-items:center;width:100%;padding:14px 0;border:0;border-top:1px solid var(--glass-line);background:none;color:inherit;text-align:left;font:inherit;cursor:pointer}
.step .n{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1.5px solid var(--glass-line);color:var(--muted);font-weight:800}
.step.next .n{border-color:var(--gold);color:var(--gold-ink)}
.step.done .n{background:var(--gold-grad);border-color:transparent;color:#0B1020}
.step .t{display:block;font-weight:700}.step .s{display:block;font-size:.85rem;color:var(--muted);margin-top:1px}
.step.done .t{color:var(--muted)}
.step .ch{margin-left:auto;font-size:1.4rem;color:var(--muted)}.step.next .ch{color:var(--gold-ink)}
.cats.accs button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px}
.cats.accs button small{font-size:.75rem;font-weight:600;opacity:.75}
#eyebtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.priv .k{width:28px;height:28px;flex:none;display:grid;place-items:center;background:var(--gold-grad);color:#0B1020;font-weight:800;font-size:.8rem}
.btn.sm{padding:7px 12px;font-size:.84rem}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}

/* navigazione */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px var(--gutter-r) calc(8px + env(safe-area-inset-bottom,0px)) var(--gutter-l);border-top:1px solid var(--glass-line)}
nav.tabs .in{display:flex;max-width:760px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:.7rem;font-weight:700;position:relative;min-width:0}
nav.tabs button .pill{padding:4px 16px;transition:background .2s}
nav.tabs button[aria-current="page"]{color:var(--gold-ink)}
nav.tabs button[aria-current="page"] .pill{color:var(--gold)}
nav.tabs button[aria-current="page"] .pill svg{stroke-width:2.2}
nav.tabs .dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;background:var(--neg);color:#fff;font-size:.62rem;display:grid;place-items:center}
.fab{position:fixed;z-index:29;right:max(16px,calc(50% - 364px),env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border:0;background:var(--gold-grad);color:#0B1020;display:grid;place-items:center;box-shadow:0 10px 24px rgba(160,132,41,.38)}
.fab svg{width:26px;height:26px;stroke-width:2.4}

/* fogli */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.45);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:760px;max-height:92%;overflow:auto;padding:12px var(--gutter-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gutter-l);background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border-top:1px solid var(--glass-line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.topbar .small{transition:none}}
.grab{width:44px;height:4px;background:var(--faint);margin:2px auto 14px;opacity:.6}
.sheet h3{margin:0 0 12px;font-size:1.3rem;letter-spacing:-.02em}
.f{display:block;margin-bottom:12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);font-size:1rem;font-weight:500}
.f .amount{font-size:1.8rem;font-weight:800;padding:8px 12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cats button{border:1px solid var(--glass-line);background:var(--glass);padding:7px 11px;font-size:.85rem;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;font-weight:600;margin-bottom:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.search{width:100%;padding:12px 14px;border:1px solid var(--glass-line);background:var(--glass);font-size:1rem}
.filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filters .seg{flex:2;min-width:230px}
.sel{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--glass-line);background:var(--glass);font-size:.92rem}
.empty{padding:26px 18px;text-align:center}
.empty p{margin:0 0 12px;color:var(--muted)}
.wf{display:flex;height:22px;margin:10px 0 6px;gap:2px}
.wf i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--glass-line);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;width:max-content}
.toast.show{opacity:1}
</style>
</head>

<script>
'use strict';
const KEY='conti_stiven_v2';
const TITLES={home:['Panoramica','Entrate, spese e risparmio a colpo d\'occhio'],conti:['Conti','Quanto c\'è in ogni conto, e come si muove'],movimenti:['Movimenti','Tutte le entrate, le spese e gli investimenti'],stipendi:['Stipendi','Buste paga e andamento del netto'],patrimonio:['Patrimonio','Liquidità, ETF, fondo pensione e proiezioni'],consigli:['Consigli','Cosa fare adesso, calcolato sui tuoi dati']};
const CATS={out:['Alimentari','Ristoranti e bar','Casa','Bollette','Auto','Trasporti','Shopping','Salute','Sport','Svago','Viaggi','Abbonamenti','Telefono','Regali','Prestiti','Carta di credito','Altro'],in:['Stipendio','Tredicesima','Extra stipendio','Rimborso','Altre entrate','Rendimento investimenti','Disinvestimento'],inv:['ETF','PAC fondi','Fondo pensione extra','Altro investimento'],tr:[]};
const EXTRA_CATS=['Tredicesima','Extra stipendio','Bonus','Premio','Quattordicesima'];
const APPNAME='Lydia';
const hello=()=>'Ciao'+(S.settings.name?' '+S.settings.name:'');
const fundName=()=>S.cometa&&S.cometa.name?S.cometa.name:'Fondo pensione';
const mainAcct=()=>(S.accounts&&S.accounts[0]&&S.accounts[0].name)||(S.settings.accounts||[])[0]||'Conto corrente';
const ACC_TYPES=[['conto','Conto corrente'],['risparmio','Conto deposito'],['contanti','Contanti'],['carta','Carta di credito'],['altro','Altro']];
const accTypeLabel=t=>(ACC_TYPES.find(x=>x[0]===t)||ACC_TYPES[4])[1];
function accGuess(n){return /contant|cash|portafogl/i.test(n)?'contanti':/carta|card|amex|visa|master/i.test(n)?'carta':/deposit|risparm|saving/i.test(n)?'risparmio':'conto'}
function movDelta(m,name){const a=+m.amount||0;let d=0;if(m.acct===name)d+=m.type==='in'?a:-a;if(m.type==='tr'&&m.to===name)d+=a;return d}
function accFlow(name){return sum(S.movs,m=>movDelta(m,name))}
function accBal(a){return(+a.adj||0)+accFlow(a.name)}
/* un movimento con data uguale o precedente all'ultimo saldo verificato è già compreso in quel saldo: non lo cambia */
function keepVerified(m){for(const n of[m.acct,m.to]){const a=n&&S.accounts.find(x=>x.name===n);if(a&&a.setOn&&m.date<=a.setOn)a.adj=Math.round(((+a.adj||0)-movDelta(m,a.name))*100)/100}}
function setAccBal(a,v){a.adj=Math.round((v-accFlow(a.name))*100)/100;a.setOn=today();delete a.auto}
function migrateAccounts(){if(S.accounts.length||!S.movs.length)return;const used=new Set(S.movs.flatMap(m=>[m.acct,m.to]).filter(Boolean));
 const names=[...new Set([...(S.settings.accounts||[]),...used])].filter(n=>used.has(n));if(!names.length)return;
 S.accounts=names.map(n=>({id:uid(),name:n,type:accGuess(n),adj:0,auto:true}));const c=lastOf(S.cash.hist);if(c){S.accounts[0].adj=Math.round((c.v-accFlow(S.accounts[0].name))*100)/100}}
const COLORS=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];

const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let F2=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}), F0=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const CURRENCIES=[['EUR','Euro'],['USD','Dollaro USA'],['GBP','Sterlina'],['CHF','Franco svizzero'],['JPY','Yen'],['CNY','Yuan'],['SEK','Corona svedese'],['NOK','Corona norvegese'],['DKK','Corona danese'],['PLN','Złoty'],['CZK','Corona ceca'],['HUF','Fiorino'],['RON','Leu'],['AUD','Dollaro australiano'],['CAD','Dollaro canadese']];
function applyCurrency(){const c=(S&&S.settings&&S.settings.currency)||'EUR';try{F2=new Intl.NumberFormat('it-IT',{style:'currency',currency:c});F0=new Intl.NumberFormat('it-IT',{style:'currency',currency:c,maximumFractionDigits:0})}catch(e){}}
const CS=()=>{try{return F0.formatToParts(0).find(p=>p.type==='currency').value}catch(e){return '€'}};
const HID=()=>!!(S&&S.settings&&S.settings.hideAmounts);const MASK=()=>'•••• '+CS();
const eur=v=>HID()?MASK():F2.format(v||0), eur0=v=>HID()?MASK():F0.format(Math.round(v||0));
const sEur0=v=>HID()?MASK():(v>=0?'+':'−')+eur0(Math.abs(v));
const pct=(v,d=1)=>v==null||!isFinite(v)?'–':(v*100).toLocaleString('it-IT',{maximumFractionDigits:d})+'%';
const sPct=v=>v==null||!isFinite(v)?'–':(v>0?'+':v<0?'−':'')+Math.abs(v*100).toLocaleString('it-IT',{maximumFractionDigits:1})+'%';
const compact=v=>HID()?'•••':new Intl.NumberFormat('it-IT',{notation:'compact',maximumFractionDigits:1}).format(v)+' '+CS();
const fq=v=>(+v).toLocaleString('it-IT',{maximumFractionDigits:4});
const numIn=v=>v===''||v==null?'':String(v).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c||1)};
const today=()=>iso(new Date());
const curK=()=>today().slice(0,7);
const shiftK=(k,n)=>{let[y,m]=k.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`};
const mShort=d=>d.toLocaleDateString('it-IT',{month:'short'}).replace('.','');
const monthLabel=k=>pd(k+'-01').toLocaleDateString('it-IT',{month:'long',year:'numeric'});
const shortK=k=>mShort(pd(k+'-01'))+' '+k.slice(2,4);
const fmtDate=s=>pd(s).toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'});
const daysSince=s=>Math.round((new Date(today())-pd(s))/864e5);
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const addMonths=(d,i)=>{const y=d.getFullYear(),m=d.getMonth()+i;const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d.getDate(),last))};

function parseNum(s){s=String(s??'').replace(/[€\s ']/g,'').replace(/^\+/,'');if(!s)return NaN;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
 const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
 if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
 else if(lc>-1){s=s.replace(/\./g,'').replace(',','.')}
 else if(ld>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
 const v=parseFloat(s);return neg?-v:v}
function parseDate(s){s=String(s??'').trim().replace(/^"|"$/g,'');let m,y,mo,d;
 if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+m[1];mo=+m[2];d=+m[3]}
 else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
 else return null;
 if(mo<1||mo>12||d<1||d>31)return null;return `${y}-${pad(mo)}-${pad(d)}`}

/* ---------- stato ---------- */
const DEF_SET={theme:'auto',hideAmounts:false,reserve:0,salary:0,spese:0,job:'indet',single:true,dependents:false,reserveAsked:false,tourDone:false,since:null,backupSnooze:null,acc:[],minOrder:2500,feePct:.15,feeMin:8,feeMax:20,satMax:15,cometaAnnuo:2390,budgets:{},currency:'EUR',privacyOk:false,backupEvery:14,lastBackup:null,seenVersion:'',projContrib:6000,projYears:10,accounts:['Conto corrente','Contanti','Carta di credito'],name:'',cardCat:'Carta di credito',extMap:{},avKey:'',tdKey:'',provider:'none',refreshMin:5};
function norm(d){d=d&&typeof d==='object'?d:{};const arr=x=>Array.isArray(x)?x:[];
 return{movs:arr(d.movs),payslips:arr(d.payslips),etfs:arr(d.etfs).map(e=>({...e,ops:arr(e.ops),hist:arr(e.hist)})),
  cometa:{hist:[],...(d.cometa||{}),hist:arr(d.cometa&&d.cometa.hist)},cash:{hist:arr(d.cash&&d.cash.hist)},loans:arr(d.loans),accounts:arr(d.accounts),extSeen:arr(d.extSeen||d.ivySeen),rev:+d.rev||0,
  settings:{...DEF_SET,...(d.settings||{})}}}
let storageOk=true;
function load(){try{const r=localStorage.getItem(KEY);if(r)return norm(JSON.parse(r))}catch(e){storageOk=false}return null}
let S=load();const firstRun=!S;if(!S)S=norm({});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOk=true}catch(e){storageOk=false;toast('Non riesco a salvare su questo dispositivo: esporta un backup',5000)}}

/* ---------- tema ---------- */
function applyTheme(){const t=S.settings.theme;const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
 const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=css('--bg')||'#EEF1F6'}
function themeSheet(){const t=S.settings.theme;openSheet(`<h3>Tema</h3><div class="seg" id="thseg">${[['auto','Automatico'],['light','Chiaro'],['dark','Scuro']].map(([k,l])=>`<button data-th="${k}" aria-pressed="${t===k}">${l}</button>`).join('')}</div><p class="note" style="margin-top:10px">Automatico segue il tema del telefono.</p>`);
 $('#thseg').onclick=e=>{const b=e.target.closest('[data-th]');if(!b)return;S.settings.theme=b.dataset.th;save();applyTheme();$$('#thseg button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}}

/* ---------- calcoli ---------- */
function kind(m){if(m.type==='tr')return 'tr';if(m.type==='out')return 'spesa';if(m.type==='inv')return 'inv';if(m.cat==='Disinvestimento')return 'disinv';if(m.cat==='Rendimento investimenti')return 'rend';if(m.cat==='Stipendio')return 'stip';if(EXTRA_CATS.includes(m.cat))return 'extra';if(m.cat==='Rimborso')return 'rimb';return 'entr'}
function agg(list){const o={stip:0,extra:0,entr:0,rimb:0,spese:0,straord:0,inv:0,disinv:0,rend:0,tr:0};
 for(const m of list){const k=kind(m),a=+m.amount||0;if(k==='spesa'){o.spese+=a;if(m.straord)o.straord+=a}else o[k]+=a}
 o.entrate=o.stip+o.extra+o.entr;o.netta=o.spese-o.rimb;o.nettaOrd=o.netta-o.straord;o.risp=o.entrate-o.netta;o.tasso=o.entrate?o.risp/o.entrate:null;return o}
const byMonth=k=>S.movs.filter(m=>m.date.startsWith(k));
const inRange=(a,b)=>S.movs.filter(m=>m.date>=a&&m.date<=b);
function lastMovK(){let mx='';for(const m of S.movs)if(m.date>mx)mx=m.date;return mx?mx.slice(0,7):curK()}
function completeMonths(){let mx='';for(const m of S.movs)if(m.date>mx)mx=m.date;if(!mx)return shiftK(curK(),-1);
 const lk=mx.slice(0,7);let lastFull=+mx.slice(8)>=27?lk:shiftK(lk,-1);const cap=shiftK(curK(),-1);return lastFull>cap?cap:lastFull}
function catSpend(list){const o={};for(const m of list)if(m.type==='out')o[m.cat]=(o[m.cat]||0)+m.amount;return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const colorOf=i=>css(COLORS[i%COLORS.length]);
const catColorCache={};
function catColor(c){if(!(c in catColorCache)){const all=catSpend(S.movs).map(x=>x[0]);let i=all.indexOf(c);if(i<0){i=0;for(const ch of c)i=(i*31+ch.charCodeAt(0))>>>0}catColorCache[c]=i%COLORS.length}return colorOf(catColorCache[c])}

/* ETF */
function etfStats(e,upTo){const ops=e.ops.filter(o=>!upTo||o.date<=upTo).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);let qty=0,cost=0;
 for(const o of ops){if(o.qty>0){qty+=o.qty;cost+=o.qty*o.price+(o.fee||0)}else{const q=Math.min(-o.qty,qty);const avg=qty?cost/qty:0;cost-=avg*q;qty-=q}}
 return{qty,cost:Math.max(0,cost)}}
const sortedHist=e=>(e.hist||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
function curPrice(e){const h=sortedHist(e);if(h.length)return h[h.length-1].p;const o=e.ops.slice().sort((a,b)=>a.date<b.date?-1:1);return o.length?o[o.length-1].price:0}
function priceDate(e){const h=sortedHist(e);return h.length?h[h.length-1].d:null}
function priceAt(e,d){let p=null;for(const x of sortedHist(e))if(x.d<=d)p=x.p;if(p==null)for(const o of e.ops.slice().sort((a,b)=>a.date<b.date?-1:1))if(o.date<=d)p=o.price;return p}
function etfRows(){return S.etfs.map((e,i)=>{const st=etfStats(e),p=curPrice(e),v=st.qty*p;return{e,st,p,v,g:v-st.cost,c:colorOf(i)}})}
function coreEtf(){const r=etfRows();return(r.find(x=>x.e.role==='core')||r.sort((a,b)=>b.v-a.v)[0]||null)}
const lastOf=h=>{const s=(h||[]).slice().sort((a,b)=>a.d<b.d?-1:1);return s.length?s[s.length-1]:null};
function loanCalc(l){const P=+l.principal||0,n=Math.max(1,Math.round(+l.months||1)),r=(+l.tan||0)/1200;const rata=r?P*r/(1-Math.pow(1+r,-n)):P/n;const st=pd(l.start);const t=today();let res=P,paid=0,intLeft=0;const rows=[];
 for(let i=0;i<n;i++){const d=iso(addMonths(st,i));const it=res*r;const cap=rata-it;res=Math.max(0,res-cap);const isPaid=d<=t;if(isPaid)paid++;else intLeft+=it;rows.push({n:i+1,d,it,cap,res,paid:isPaid})}
 return{rata,rows,paid,n,residuo:paid?rows[paid-1].res:P,intTot:rata*n-P,intLeft,next:rows[paid]||null}}
function wealth(){const com=lastOf(S.cometa.hist);const etf=sum(etfRows(),x=>x.v);const debt=sum(S.loans,l=>loanCalc(l).residuo);let cash=0,cashD=null;
 if(S.accounts.length){cash=sum(S.accounts,accBal);cashD=today()}else{const c=lastOf(S.cash.hist);if(c){cash=c.v;cashD=c.d}}
 return{cash,cashD,etf,cometa:com?com.v:0,cometaD:com&&com.d,debt,tot:cash+etf+(com?com.v:0)-debt}}
function fee(amount){const s=S.settings;return Math.min(s.feeMax,Math.max(s.feeMin,amount*s.feePct/100))}

/* ---------- quotazioni automatiche ---------- */
const Q={busy:false,last:null,err:'',timer:null};
const PROV={td:{name:'Twelve Data',min:2,ex:'VWCE:XETR'},av:{name:'Alpha Vantage',min:30,ex:'VWCE.DEX'}};
function provKey(){const s=S.settings;return s.provider==='td'?s.tdKey:s.provider==='av'?s.avKey:''}
function setPrice(e,p,d,t){const h=e.hist.find(x=>x.d===d);if(h){h.p=p;if(t)h.t=t}else e.hist.push(t?{d,p,t}:{d,p})}
async function quote(sym){const s=S.settings,k=provKey();
 if(s.provider==='td'){const[sy,ex]=sym.split(':');const r=await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(sy)}${ex?`&mic_code=${encodeURIComponent(ex)}`:''}&apikey=${encodeURIComponent(k)}`);const j=await r.json();
  if(j.status==='error'||j.code)throw new Error(j.message||'Simbolo non trovato');const p=parseFloat(j.close);if(!(p>0))throw new Error('Prezzo non disponibile');
  return{p,d:(j.datetime||today()).slice(0,10),chg:parseFloat(j.percent_change)/100,cur:j.currency}}
 const r=await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(sym)}&apikey=${encodeURIComponent(k)}`);const j=await r.json();
 if(j.Note||j.Information)throw new Error('Limite di richieste raggiunto');const g=j['Global Quote'];const p=g?parseFloat(g['05. price']):NaN;if(!(p>0))throw new Error('Simbolo non trovato');
 return{p,d:g['07. latest trading day']||today(),chg:parseFloat(String(g['10. change percent']||'').replace('%',''))/100}}
async function refreshQuotes(manual){const s=S.settings;if(s.provider==='none'||!provKey()){if(manual)toast('Imposta prima le quotazioni automatiche in Dati e impostazioni',4000);return}
 if(Q.busy)return;Q.busy=true;Q.err='';let ok=0;const list=S.etfs.filter(e=>e.sym||e.ticker);
 for(const e of list){try{const q=await quote(e.sym||e.ticker);const t=new Date().toTimeString().slice(0,5);setPrice(e,q.p,q.d,t);e.chg=isFinite(q.chg)?q.chg:null;ok++}
  catch(err){Q.err=(err&&err.message==='Failed to fetch')||err instanceof TypeError?'Le quotazioni automatiche non sono raggiungibili da questa versione: usa l\'app installata':`${e.ticker||e.name}: ${err.message}`;if(err instanceof TypeError)break}}
 Q.busy=false;if(ok){Q.last=new Date();save()}if(manual)toast(Q.err||`Prezzi aggiornati (${ok} su ${list.length})`,Q.err?6000:2600);
 if(!$('#ov').classList.contains('open')&&(tab==='patrimonio'||tab==='home'))render()}
function marketOpen(){const n=new Date();const d=n.getDay();const m=n.getHours()*60+n.getMinutes();return d>=1&&d<=5&&m>=8*60+55&&m<=17*60+40}
function startQuotes(){clearInterval(Q.timer);const s=S.settings;if(s.provider==='none'||!provKey())return;
 const every=Math.max(PROV[s.provider].min,+s.refreshMin||5)*60000;refreshQuotes(false);
 Q.timer=setInterval(()=>{if(document.visibilityState==='visible'&&marketOpen())refreshQuotes(false)},every)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.settings.provider!=='none'&&(!Q.last||Date.now()-Q.last>60000))refreshQuotes(false)});

/* ---------- lettura PDF (testo), senza librerie esterne ---------- */
async function inflatePDF(u){for(const f of['deflate','deflate-raw']){try{return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream(f))).arrayBuffer())}catch(e){}}return null}
const latin1=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return s};
async function pdfLines(buf){const u=new Uint8Array(buf);const T=latin1(u);if(!T.startsWith('%PDF'))throw new Error('Non è un PDF');

 if(typeof DecompressionStream==='undefined')throw new Error('Questo browser non sa leggere i PDF');
 const objs={};const re=/(\d+)\s+(\d+)\s+obj\b/g;let m;
 while((m=re.exec(T))){const id=m[1],st=m.index+m[0].length;let si=T.slice(st,st+20000).search(/\bstream(\r\n|\r|\n)|endobj/);if(si<0)break;si+=st;let dict,stream=null,end;
  if(T.startsWith('endobj',si)){dict=T.slice(st,si);end=si}
  else{dict=T.slice(st,si);const a=si+T.slice(si).match(/^stream(\r\n|\r|\n)/)[0].length;const lm=dict.match(/\/Length\s+(\d+)(\s+(\d+)\s+R)?/);let len=-1;
   if(lm&&!lm[2])len=+lm[1];else if(lm){const lo=T.match(new RegExp('(?:^|[\\r\\n\\s])'+lm[1]+'\\s+0\\s+obj\\s*(\\d+)'));if(lo)len=+lo[1]}
   if(len<0||T.slice(a+len,a+len+12).indexOf('endstream')<0)len=T.indexOf('endstream',a)-a;
   let raw=u.subarray(a,a+len);if(/FlateDecode/.test(dict))raw=await inflatePDF(raw);else if(/\/Filter/.test(dict))raw=null;stream=raw;end=T.indexOf('endobj',a+len);if(end<0)end=a+len}

function insights(){const out=[],s=S.settings,W=wealth(),R=etfRows(),V=sum(R,x=>x.v);
 const add=(lv,title,text,action)=>out.push({lv,title,text,action});
 // liquidità
 const accTot=sum(s.acc,a=>a.amount),soglia=s.reserve+accTot;
 if(!(s.reserve>0))add('act','Imposta la riserva di emergenza','Tre domande su stipendio e lavoro: ti propongo quanto tenere da parte prima di investire.',{label:'Calcola la riserva',fn:'reserve'});
 if(W.cashD&&s.reserve>0){const ex=W.cash-soglia;
  if(W.cash<s.reserve)add('bad','Riserva sotto la soglia',`Sul conto hai ${eur0(W.cash)}, sotto la riserva di ${eur0(s.reserve)}. Rimanda i prossimi acquisti finché non torni sopra.`);
  else if(ex>=s.minOrder){const core=coreEtf();let t=`Sul conto hai ${eur0(W.cash)}: tolti riserva${accTot?' e accantonamenti':''} (${eur0(soglia)}) restano ${eur0(ex)}.`;
   if(core&&core.p){const q=Math.floor((ex-fee(ex))/core.p);const f=fee(q*core.p);t+=` A ${eur(core.p)} sono ${q} quote di ${core.e.ticker||core.e.name} per ${eur0(q*core.p)}, commissione circa ${eur(f)} (${pct(f/(q*core.p),2)}).`}
   add('act',`Puoi investire ${eur0(ex)}`,t+' Usa un ordine con limite, tra le 10 e le 17.')}
  else if(ex>0)add('info','Eccedenza ancora piccola',`Sopra la soglia ci sono ${eur0(ex)}. Aspetta di arrivare a ${eur0(s.minOrder)}: con la commissione minima di ${eur(s.feeMin)} un ordine piccolo costa ${pct(s.feeMin/Math.max(ex,1),1)}.`);
  if(!S.accounts.length&&daysSince(W.cashD)>30)add('info','Aggiorna il saldo del conto',`L'ultimo saldo è del ${fmtDate(W.cashD)}. Aggiornalo per avere consigli sull'eccedenza corretti.`,{label:'Aggiorna saldo',fn:'cash'});
  const old=S.accounts.filter(a=>a.setOn&&daysSince(a.setOn)>60);if(old.length)add('info','Controlla i saldi dei conti',`${old.map(a=>a.name).join(', ')}: l'ultima verifica con la banca è di oltre due mesi fa. Se il saldo non torna, correggilo.`,{label:'Gestisci conti',fn:'cash'})}
 else if(!W.cashD)add('info','Aggiungi i tuoi conti','Servono per avere i saldi aggiornati e calcolare quanto puoi investire sopra la riserva.',{label:'Aggiungi conti',fn:'cash'});
 // satellite
 if(V>0)for(const x of R)if(x.e.role==='sat'){const w=x.v/V;if(w>s.satMax/100)add('warn',`${x.e.ticker||x.e.name} sopra il ${s.satMax}%`,`Pesa il ${pct(w)} degli ETF. Non vendere: compra solo il core finché non torna sotto il limite.`);
  else add('good',`${x.e.ticker||x.e.name} al ${pct(w)} degli ETF`,`Sotto il limite del ${s.satMax}% che ti sei dato. Con i nuovi acquisti solo sul core scenderà da solo.`)}
 // prezzi vecchi
 for(const x of R){const d=priceDate(x.e);if(d&&daysSince(d)>21)add('info',`Prezzo di ${x.e.ticker||x.e.name} da aggiornare`,`L'ultimo prezzo è del ${fmtDate(d)}: il valore del patrimonio potrebbe essere diverso.`,{label:'Aggiorna prezzo',fn:'etf:'+x.e.id})}
 // risparmio
 const lf=completeMonths();const k3=[0,1,2].map(i=>shiftK(lf,-i)),k12=[];for(let i=3;i<15;i++)k12.push(shiftK(lf,-i));
 const a3=agg(k3.flatMap(byMonth)),a12=agg(k12.flatMap(byMonth));
 if(a3.entrate&&a12.entrate){const t3=a3.risp/a3.entrate,t12=a12.risp/a12.entrate;
  if(t3<t12-.05)add('warn','Stai risparmiando meno del solito',`Negli ultimi 3 mesi hai messo da parte il ${pct(t3)} delle entrate, contro il ${pct(t12)} dei 12 mesi prima.`);
  else if(t3>=.2)add('good',`Risparmi il ${pct(t3)} delle entrate`,`Media degli ultimi 3 mesi completi${t3>t12?`, meglio del ${pct(t12)} dei 12 mesi prima`:''}. Sopra il 20% è un ottimo ritmo.`);
  else add('info',`Risparmi il ${pct(t3)} delle entrate`,`Ultimi 3 mesi completi, contro il ${pct(t12)} dei 12 mesi prima. Un obiettivo comune è il 20%.`)}
 // categorie in crescita
 const lastCats=catSpend(byMonth(lf)),prevK=[1,2,3,4,5,6].map(i=>shiftK(lf,-i));
 const prevAvg={};for(const[c,v]of catSpend(prevK.flatMap(byMonth)))prevAvg[c]=v/6;
 const ups=lastCats.filter(([c,v])=>c!==S.settings.cardCat&&v-(prevAvg[c]||0)>80&&v>(prevAvg[c]||0)*1.4).slice(0,3);
 for(const[c,v]of ups)add('warn',`${c}: spesa in aumento`,`A ${monthLabel(lf)} hai speso ${eur0(v)} in ${c}, contro una media di ${eur0(prevAvg[c]||0)} al mese nei 6 mesi prima.`);
 // budget
 for(const[c,b]of Object.entries(s.budgets||{})){if(!(b>0))continue;const v=sum(byMonth(curK()).filter(m=>m.type==='out'&&m.cat===c),m=>m.amount);if(v>b)add('bad',`Budget ${c} superato`,`Questo mese ${eur0(v)} su ${eur0(b)}.`);else if(v>b*.8)add('warn',`Budget ${c} quasi finito`,`Questo mese ${eur0(v)} su ${eur0(b)}.`)}
 // ricorrenti
 const rec=recurring();if(rec.length){const tot=sum(rec,r=>r.avg);add('info',`Spese ricorrenti: circa ${eur0(tot)} al mese`,rec.slice(0,6).map(r=>`${r.name} ${eur0(r.avg)}`).join(' · ')+'. Controlla ogni tanto se ti servono ancora tutte.')}
 // saldo carta senza categorie
 const l12=[];for(let i=0;i<12;i++)l12.push(shiftK(lf,-i));const sp12=catSpend(l12.flatMap(byMonth)),tot12=sum(sp12,x=>x[1]),card=S.settings.cardCat,amex=(sp12.find(x=>x[0]===card)||[0,0])[1];
 if(tot12&&amex/tot12>.25)add('info',`${card} è il ${pct(amex/tot12,0)} delle spese`,`Il saldo della carta arriva come un unico movimento, quindi quelle spese non hanno una categoria. Per analisi più precise registra le spese grosse della carta con la loro categoria e il saldo ${card} solo per la differenza.`);
 // busta senza accredito
 for(const p of S.payslips){const k=p.month,n=shiftK(k,1);const has=S.movs.some(m=>kind(m)==='stip'&&(m.date.startsWith(k)||m.date.startsWith(n)&&m.date.slice(8)<='10'));if(!has&&k>=shiftK(curK(),-3))add('act',`Accredito di ${monthLabel(k)} non registrato`,`Hai la busta paga da ${eur(p.netto)} ma nessun movimento Stipendio${p.rimborsi?`. Ricorda che ${eur(p.rimborsi)} sono rimborso spese`:''}.`,{label:'Registra accredito',fn:'sal:'+p.id})}
 // fondo pensione
 const mo=new Date().getMonth()+1;if(mo>=10&&s.cometaAnnuo>0){const m=5164.57-s.cometaAnnuo;if(m>500)add('info',`${fundName()}: margine deducibile`,`Quest'anno versi circa ${eur0(s.cometaAnnuo)} deducibili su un tetto di 5.164,57 €. Un versamento extra entro il 31 dicembre ti farebbe risparmiare circa il 33% di IRPEF su ogni euro, ma resta vincolato fino alla pensione.`)}
 // dati vecchi
 const lm=S.movs.reduce((a,m)=>m.date>a?m.date:a,'');if(lm&&daysSince(lm)>20)add('info','Movimenti da aggiornare',`L'ultimo movimento registrato è del ${fmtDate(lm)}. Importa l'estratto conto o aggiungi i movimenti mancanti.`,{label:'Importa CSV',fn:'import'});
 const ord={bad:0,act:1,warn:2,good:3,info:4};return out.sort((a,b)=>ord[a.lv]-ord[b.lv])}
function recurring(){const lf=completeMonths(),ks=[0,1,2,3,4,5].map(i=>shiftK(lf,-i));const g={};
 for(const m of ks.flatMap(byMonth))if(m.type==='out'&&m.cat!==S.settings.cardCat&&!/aliment|cibo|ristor|shopping|spesa/i.test(m.cat)&&m.cat!=='Shopping'){const key=(m.desc||m.cat).toLowerCase().replace(/\d+/g,'').trim()||m.cat.toLowerCase();(g[key]=g[key]||{name:m.desc||m.cat,months:new Set(),tot:0}).months.add(m.date.slice(0,7));g[key].tot+=m.amount}
 return Object.values(g).filter(x=>x.months.size>=4).map(x=>({name:x.name,avg:x.tot/x.months.size})).sort((a,b)=>b.avg-a.avg)}
function tipHTML(t){const L={act:'Da fare',warn:'Attenzione',bad:'Urgente',good:'Bene',info:'Info'};return `<div class="tip lv-${t.lv}"><i class="stripe"></i><div style="min-width:0"><span class="chip">${L[t.lv]}</span><div class="tt">${esc(t.title)}</div><div class="tx">${esc(t.text)}</div>${t.action?`<div class="act"><button class="btn ghost sm" data-tipfn="${esc(t.action.fn)}">${esc(t.action.label)}</button></div>`:''}</div></div>`}

 `<section class="blk glass card"><div class="headrow"><div><h2>Budget mensili</h2><p class="sub">Facoltativi: ti avviso quando ti avvicini al limite.</p></div><button class="btn ghost sm" id="editbud">Modifica</button></div>
 ${Object.entries(S.settings.budgets).filter(([c,b])=>b>0).map(([c,b])=>{const v=sum(byMonth(curK()).filter(m=>m.type==='out'&&m.cat===c),m=>m.amount);return `<div style="padding:8px 0;border-top:1px solid var(--glass-line)"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><span class="num"><b>${eur0(v)}</b> / ${eur0(b)}</span></div><div class="bar"><i style="width:${Math.min(100,v/b*100)}%;background:${v>b?'var(--neg)':v>b*.8?'var(--warn)':'var(--pos)'}"></i></div></div>`}).join('')||'<p class="note">Nessun budget impostato.</p>'}</section>
 <p class="note" style="margin:6px 2px 0">I consigli sono calcoli automatici sui tuoi dati, non consulenza finanziaria.</p>`;
 bindTipActions();$('#editbud').onclick=budgetSheet}
function budgetSheet(){const lf=completeMonths();const ks=[0,1,2,3,4,5].map(i=>shiftK(lf,-i));const avg={};for(const[c,v]of catSpend(ks.flatMap(byMonth)))avg[c]=v/6;const cats=Object.keys(avg).slice(0,14);
 openSheet(`<h3>Budget mensili</h3><p class="note" style="margin-top:-6px">Lascia vuoto per non impostarlo. Accanto, la tua media degli ultimi 6 mesi.</p><div style="margin-top:12px">${cats.map((c,i)=>`<label class="f">${esc(c)} <span style="font-weight:500">· media ${eur0(avg[c])}</span><input data-bc="${esc(c)}" inputmode="decimal" value="${numIn(S.settings.budgets[c]||'')}"></label>`).join('')}</div><div class="actions"><button class="btn" id="bsv">Salva</button></div>`);

let lastExt=null;
async function importExt(file){let j;try{j=await readExt(file)}catch(e){toast(e.message||'File non valido',5000);return}lastExt=j;
 extMapSheet(j,async K=>{const r=extToMovs(j,K);const nin=r.out.filter(m=>m.type==='in').length,ninv=r.out.filter(m=>m.type==='inv').length,ntr=r.out.filter(m=>m.type==='tr').length;
  if(!r.out.length){closeSheet();toast(r.newSeen.length?'Nessun movimento da importare':'Nessun movimento nuovo nel backup',4000);S.extSeen.push(...r.newSeen);save();return}
  if(await ask(`Importare ${r.out.length} movimenti dal backup?`,`${r.out.length-nin-ninv-ntr} spese, ${nin} entrate, ${ninv} investimenti, ${ntr} giroconti.${r.skipped?` ${r.skipped} tra rettifiche, movimenti dei conti investimento e doppioni saltati.`:''} Saldi nel backup: ${r.names.map(n=>n+' '+eur(r.per[n]||0)).join(', ')}.`,'Importa')){
   S.movs.push(...r.out);S.extSeen.push(...r.newSeen);
   for(const n of r.names){let a=S.accounts.find(x=>x.name===n);if(!a){a={id:uid(),name:n,type:accGuess(n),adj:0};S.accounts.push(a)}setAccBal(a,Math.round((r.per[n]||0)*100)/100)}
   S.settings.accounts=S.accounts.map(a=>a.name);save();mf={q:'',t:'all',m:'all',c:'all',a:'all'};go('movimenti');toast(`Importati ${r.out.length} movimenti, saldi dei conti aggiornati`,4000);
   const inv=extInvAccounts(j,K);if(inv.length)setTimeout(()=>invSetupSheet(inv),700)}})}
/* conti di investimento trovati nel backup: diventano ETF o fondi in Patrimonio */
function extInvAccounts(j,K){const A={};j.accounts.forEach(a=>A[a.id]=a.name);const o={};
 for(const t of j.transactions){if(!t.dateTime)continue;const d=iso(new Date(t.dateTime));const add=(id,v)=>{if(K[id]!=='inv')return;const x=o[id]||(o[id]={name:A[id],tot:0,n:0,first:d,last:d});x.tot+=v;x.n++;if(d<x.first)x.first=d;if(d>x.last)x.last=d};
  if(t.type==='TRANSFER'){if(A[t.toAccountId]!==undefined)add(t.toAccountId,+(t.toAmount||t.amount));if(K[t.toAccountId]!=='inv'||1)add(t.accountId,-t.amount)}else if(t.type==='INCOME')add(t.accountId,+t.amount);else if(t.type==='EXPENSE')add(t.accountId,-t.amount)}
 const nm=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'');return Object.values(o).filter(x=>x.tot>0.5).map(x=>({...x,tot:Math.round(x.tot*100)/100,fund:/pac|fond|fund/i.test(x.name),exists:S.etfs.find(e=>nm(e.name)===nm(x.name)||(e.ticker&&nm(x.name).includes(nm(e.ticker))))}))}

  <label style="display:flex;gap:6px;align-items:center;font-weight:700;font-size:.85rem;white-space:nowrap"><input type="checkbox" class="ivon" ${x.exists?'':'checked'} style="width:18px;height:18px;accent-color:var(--gold)">Aggiungi</label></div>

  <div class="f2" style="margin-top:8px"><label class="f">Nome<input class="ivn" value="${esc(x.name)}"></label><label class="f">Ticker (facoltativo)<input class="ivt" placeholder="Per esempio VWCE" autocapitalize="characters"></label></div>
  <div class="f2"><label class="f">Quote possedute<input class="ivq" inputmode="decimal" placeholder="Per esempio 41"></label><label class="f">Prezzo medio di carico (${CS()})<input class="ivp" inputmode="decimal" placeholder="Se vuoto: versato ÷ quote"></label></div>
  <div class="f2"><label class="f">Tipo<select class="ivr"><option value="core" ${i===0&&!x.fund?'selected':''}>ETF principale (core)</option><option value="sat" ${i>0&&!x.fund?'selected':''}>ETF satellite</option><option value="fund" ${x.fund?'selected':''}>Fondo o PAC</option></select></label><div class="f note ivx" style="align-self:end"></div></div></div>`).join('')}</div>
 <div class="actions"><button class="btn ghost" id="ivx">Più tardi</button><button class="btn gold" id="ivs">Aggiungi a Patrimonio</button></div>`);
 const rows=()=>[...$$('#ivl [data-iv]')].map(r=>({x:list[+r.dataset.iv],on:r.querySelector('.ivon').checked,name:r.querySelector('.ivn').value.trim(),ticker:r.querySelector('.ivt').value.trim().toUpperCase(),q:parseNum(r.querySelector('.ivq').value),p:parseNum(r.querySelector('.ivp').value),role:r.querySelector('.ivr').value,el:r}));
 const upd=()=>rows().forEach(o=>{const t=o.el.querySelector('.ivx');if(o.q>0){const pm=o.p>0?o.p:o.x.tot/o.q;t.textContent=`${fq(o.q)} quote × ${eur(pm)} = ${eur(o.q*pm)}`}else t.textContent=''});
 $('#ivl').oninput=upd;$('#ivx').onclick=()=>{closeSheet();toast('Puoi aggiungerli quando vuoi da Patrimonio, con Aggiungi ETF',4500)};
 $('#ivs').onclick=()=>{const R=rows().filter(o=>o.on);if(R.some(o=>!(o.q>0))){toast('Scrivi le quote per ogni investimento selezionato');return}
  for(const o of R){const pm=o.p>0?o.p:Math.round(o.x.tot/o.q*10000)/10000;S.etfs.push({id:uid(),name:o.name||o.x.name,ticker:o.ticker,sym:'',role:o.role==='fund'?'sat':o.role,kind:o.role==='fund'?'fondo':'etf',ops:[{id:uid(),date:o.x.last,qty:o.q,price:pm,fee:0,note:'Posizione importata dal backup'}],hist:[{d:o.x.last,p:pm}]})}
  save();closeSheet();go('patrimonio');toast(R.length?`Aggiunti ${R.length} investimenti: aggiorna il prezzo di oggi per vedere il valore`:'Nessun investimento aggiunto',5000)}}

async function importCSVFile(file){if(/\.(xlsx?|ods|numbers)$/i.test(file.name)){toast('È un foglio di calcolo: esportalo in CSV e riprova',5000);return}
 const res=csvToMovs(await readText(file));if(res.error){toast(res.error,4000);return}
 const k=m=>m.date+'|'+m.amount.toFixed(2)+'|'+m.type;const ex=new Set(S.movs.map(k));const fresh=res.movs.filter(m=>!ex.has(k(m)));const dup=res.movs.length-fresh.length;
 if(!fresh.length){toast(`Nessun movimento nuovo (${dup} già presenti)`,5000);return}
 if(await ask(`Importare ${fresh.length} movimenti?`,`${dup?dup+' già presenti verranno saltati. ':''}${res.skipped?res.skipped+' righe senza data o importo verranno ignorate.':''}`,'Importa')){S.movs.push(...fresh);save();mf={q:'',t:'all',m:'all',c:'all',a:'all'};go('movimenti');toast(`Importati ${fresh.length} movimenti`)}}
async function restoreFile(file){let j;try{j=JSON.parse(await readText(file))}catch(e){toast('Il file non è un backup valido');return}
 if(j&&j.cifrato&&j.dati){for(let k=0;k<3;k++){const pw=await askPassword('Backup protetto',k?'Password sbagliata, riprova.':'Scrivi la password usata per questo backup.');if(!pw)return;try{j=JSON.parse(await decryptJSON(j,pw));break}catch(e){if(k===2){toast('Password sbagliata',4000);return}}}}
 if(!j||!Array.isArray(j.movs)){toast('Il file non è un backup di questa app');return}
 if(await ask('Ripristinare il backup?',`Contiene ${j.movs.length} movimenti e ${(j.etfs||[]).length} ETF. I dati attuali verranno sostituiti.`,'Ripristina',true)){const keep=S.settings;S=norm(j);S.settings.privacyOk=true;S.settings.seenVersion=APP_VERSION;S.settings.lastBackup=S.settings.lastBackup||today();applyCurrency();migrateAccounts();save();applyTheme();go('home');startQuotes();toast('Backup ripristinato')}}
