<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Lydia</title>
<meta name="theme-color" content="#EEF1F6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: app a una colonna stile One UI (titolo grande in alto, contenuto a portata di pollice, barra in basso), superfici in vetro e angoli vivi */
:root{
  --bg:#EEF1F6; --blob1:#BFD3FF; --blob2:#CDEBDD; --blob3:#F3D9E4;
  --ink:#141A24; --muted:#5D6778; --faint:#8A93A3;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(20,30,50,.09); --glass-hi:rgba(255,255,255,.7);
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(47,107,255,.12);
  --pos:#14915A; --neg:#D93D44; --warn:#B87400; --info:#2F6BFF;
  --c1:#2F6BFF; --c2:#14A37F; --c3:#E08A1E; --c4:#C2417A; --c5:#7A5AE0; --c6:#2BA3C9; --c7:#8B9A2E; --c8:#9AA3B2;
  --shadow:0 10px 30px rgba(20,30,60,.08);
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0D13; --blob1:#16306E; --blob2:#0F3B2E; --blob3:#3A1630;
  --ink:#EAEFF7; --muted:#9AA5B8; --faint:#6D778A;
  --glass:rgba(24,29,40,.58); --glass-strong:rgba(22,27,37,.9); --glass-line:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.06);
  --accent:#6B9BFF; --accent-ink:#0A0D13; --accent-soft:rgba(107,155,255,.16);
  --pos:#43C98A; --neg:#FF6B70; --warn:#F2B441; --info:#6B9BFF;
  --c1:#6B9BFF; --c2:#3FCFA4; --c3:#F2A54A; --c4:#EE76A8; --c5:#A48CFF; --c6:#5CC6E8; --c7:#B9C85A; --c8:#7F8899;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D13; --blob1:#16306E; --blob2:#0F3B2E; --blob3:#3A1630;
  --ink:#EAEFF7; --muted:#9AA5B8; --faint:#6D778A;
  --glass:rgba(24,29,40,.58); --glass-strong:rgba(22,27,37,.9); --glass-line:rgba(255,255,255,.08); --glass-hi:rgba(255,255,255,.06);
  --accent:#6B9BFF; --accent-ink:#0A0D13; --accent-soft:rgba(107,155,255,.16);
  --pos:#43C98A; --neg:#FF6B70; --warn:#F2B441; --info:#6B9BFF;
  --c1:#6B9BFF; --c2:#3FCFA4; --c3:#F2A54A; --c4:#EE76A8; --c5:#A48CFF; --c6:#5CC6E8; --c7:#B9C85A; --c8:#7F8899;
  --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;width:70vmax;height:70vmax;filter:blur(60px);opacity:.75;border-radius:50%}
.bgfx i:nth-child(1){background:var(--blob1);top:-30vmax;left:-20vmax}
.bgfx i:nth-child(2){background:var(--blob2);top:20vh;right:-35vmax}
.bgfx i:nth-child(3){background:var(--blob3);bottom:-40vmax;left:-10vmax;opacity:.5}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra in alto */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;height:56px}
.topbar .small{flex:1;font-weight:700;font-size:1.05rem;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.topbar.scrolled{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid var(--glass-line)}
.topbar.scrolled .small{opacity:1;transform:none}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{position:relative;z-index:1;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
.bigtitle{padding:22px 2px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:flex-end}
.bigtitle h1{font-size:2.35rem;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.bigtitle p{margin:8px 0 0;color:var(--muted);max-width:52ch}

section.blk{margin:0 0 14px}
.card{padding:16px}
.card h2{font-size:1rem;font-weight:700;margin:0;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:.84rem;margin:2px 0 0}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lab{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.02em}
.eyebrow{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.note{color:var(--muted);font-size:.84rem;margin:0}

/* segmenti */
.seg{display:flex;padding:3px;gap:3px;border:1px solid var(--glass-line);background:var(--glass)}
.seg button{flex:1;border:0;background:none;padding:8px 10px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.pernav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.pernav b{font-size:1rem;text-transform:capitalize}
.pernav button{width:40px;height:40px;border:1px solid var(--glass-line);background:var(--glass);font-size:1.2rem}
.pernav button:disabled{opacity:.35;cursor:default}

/* hero */
.hero{padding:20px 18px}
.hero .big{font-size:2.5rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 2px}
.hero .meta{color:var(--muted);font-size:.86rem}
.split{display:flex;height:10px;margin:14px 0 4px;gap:2px;background:var(--glass-line)}
.split i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:619px){.tiles.t3>:last-child:nth-child(3){grid-column:span 2}}
@media (min-width:620px){.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{padding:14px;min-width:0}
.tile .v{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:.78rem;font-weight:600;margin-top:2px;color:var(--muted)}
.chart{position:relative;height:240px}
.chart.sm{height:200px}.chart.lg{height:280px}
.legend{margin-top:10px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--glass-line);font-size:.9rem}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;flex:none}
.bar{height:6px;background:var(--glass-line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}

/* liste */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--glass-line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap}
.ico{width:36px;height:36px;display:grid;place-items:center;flex:none;font-weight:800;font-size:.8rem;color:#fff}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:.88rem}
.grouphead b{text-transform:capitalize}

/* tabelle */
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--glass-line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:.76rem;letter-spacing:.02em}
tr:last-child td{border-bottom:0}

/* consigli */
.tip{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--glass-line)}
.tip:last-child{border-bottom:0}
.tip .stripe{width:4px;flex:none}
.tip .tt{font-weight:800}
.tip .tx{color:var(--muted);font-size:.88rem;margin-top:3px}
.tip .act{margin-top:10px}
.chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;margin-bottom:6px}
.lv-act .stripe{background:var(--accent)} .lv-act .chip{background:var(--accent-soft);color:var(--accent)}
.lv-warn .stripe{background:var(--warn)} .lv-warn .chip{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.lv-bad .stripe{background:var(--neg)} .lv-bad .chip{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.lv-good .stripe{background:var(--pos)} .lv-good .chip{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.lv-info .stripe{background:var(--faint)} .lv-info .chip{background:var(--glass-line);color:var(--muted)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;padding:11px 16px;font-weight:800;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.ghost{background:var(--glass);color:var(--ink);border-color:var(--glass-line)}
.btn.danger{background:none;color:var(--neg);border-color:var(--neg)}
.btn.dangerfill{background:var(--neg);color:#fff}
.btn.sm{padding:7px 12px;font-size:.84rem}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}

/* navigazione */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:6px var(--gutter-r) calc(8px + env(safe-area-inset-bottom,0px)) var(--gutter-l);border-top:1px solid var(--glass-line)}
nav.tabs .in{display:flex;max-width:760px;margin:0 auto}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:.7rem;font-weight:700;position:relative;min-width:0}
nav.tabs button .pill{padding:4px 16px;transition:background .2s}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent)}
nav.tabs .dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:16px;height:16px;padding:0 4px;background:var(--neg);color:#fff;font-size:.62rem;display:grid;place-items:center}
.fab{position:fixed;z-index:29;right:max(16px,calc(50% - 364px),env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px rgba(47,107,255,.35)}
.fab svg{width:26px;height:26px;stroke-width:2.4}

/* fogli */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,10,20,.45);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{width:100%;max-width:760px;max-height:92%;overflow:auto;padding:12px var(--gutter-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gutter-l);background:var(--glass-strong);-webkit-backdrop-filter:blur(26px) saturate(150%);backdrop-filter:blur(26px) saturate(150%);border-top:1px solid var(--glass-line);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.topbar .small{transition:none}}
.grab{width:44px;height:4px;background:var(--faint);margin:2px auto 14px;opacity:.6}
.sheet h3{margin:0 0 12px;font-size:1.3rem;letter-spacing:-.02em}
.f{display:block;margin-bottom:12px;font-size:.8rem;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);font-size:1rem;font-weight:500}
.f .amount{font-size:1.8rem;font-weight:800;padding:8px 12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cats button{border:1px solid var(--glass-line);background:var(--glass);padding:7px 11px;font-size:.85rem;font-weight:600}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:center;font-size:.9rem;font-weight:600;margin-bottom:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.search{width:100%;padding:12px 14px;border:1px solid var(--glass-line);background:var(--glass);font-size:1rem}
.filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.filters .seg{flex:2;min-width:230px}
.sel{flex:1;min-width:140px;padding:10px 12px;border:1px solid var(--glass-line);background:var(--glass);font-size:.92rem}
.empty{padding:26px 18px;text-align:center}
.empty p{margin:0 0 12px;color:var(--muted)}
.wf{display:flex;height:22px;margin:10px 0 6px;gap:2px}
.wf i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--glass-line);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;width:max-content}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="topbar" id="topbar"><div class="in">
  <div class="small" id="smalltitle">Panoramica</div>
  <button class="iconbtn" id="themebtn" aria-label="Cambia tema"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg></button>
  <button class="iconbtn" id="gear" aria-label="Impostazioni e backup"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg></button>
</div></header>
<main><div class="wrap" id="main"></div></main>
<button class="fab" id="fab" aria-label="Aggiungi movimento"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<nav class="tabs glass" aria-label="Sezioni"><div class="in">
  <button data-tab="home"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg></span>Home</button>
  <button data-tab="movimenti"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span>Movimenti</button>
  <button data-tab="stipendi"><span class="pill"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>Stipendi</button>
  <button data-tab="patrimonio"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>Patrimonio</button>
  <button data-tab="consigli"><span class="pill"><svg class="i" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg></span>Consigli<span class="dot" id="tipdot" hidden></span></button>
</div></nav>
<div class="overlay" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
const KEY='conti_stiven_v2';
const TITLES={home:['Panoramica','Entrate, spese e risparmio a colpo d\'occhio'],movimenti:['Movimenti','Tutte le entrate, le spese e gli investimenti'],stipendi:['Stipendi','Buste paga e andamento del netto'],patrimonio:['Patrimonio','Liquidità, ETF, fondo pensione e proiezioni'],consigli:['Consigli','Cosa fare adesso, calcolato sui tuoi dati']};
const CATS={out:['Alimentari','Ristoranti e bar','Casa','Bollette','Auto','Trasporti','Shopping','Salute','Sport','Svago','Viaggi','Abbonamenti','Telefono','Regali','Prestiti','Carta di credito','Altro'],in:['Stipendio','Tredicesima','Extra stipendio','Rimborso','Altre entrate','Rendimento investimenti','Disinvestimento'],inv:['ETF','PAC fondi','Fondo pensione extra','Altro investimento'],tr:[]};
const EXTRA_CATS=['Tredicesima','Extra stipendio','Bonus','Premio','Quattordicesima'];
const APPNAME='Lydia';
const hello=()=>'Ciao'+(S.settings.name?' '+S.settings.name:'');
const fundName=()=>S.cometa&&S.cometa.name?S.cometa.name:'Fondo pensione';
const mainAcct=()=>(S.settings.accounts||[])[0]||'Conto corrente';
const COLORS=['--c1','--c2','--c3','--c4','--c5','--c6','--c7','--c8'];

const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F2=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}), F0=new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur=v=>F2.format(v||0), eur0=v=>F0.format(Math.round(v||0));
const sEur0=v=>(v>=0?'+':'−')+eur0(Math.abs(v));
const pct=(v,d=1)=>v==null||!isFinite(v)?'–':(v*100).toLocaleString('it-IT',{maximumFractionDigits:d})+'%';
const sPct=v=>v==null||!isFinite(v)?'–':(v>0?'+':v<0?'−':'')+Math.abs(v*100).toLocaleString('it-IT',{maximumFractionDigits:1})+'%';
const compact=v=>new Intl.NumberFormat('it-IT',{notation:'compact',maximumFractionDigits:1}).format(v)+' €';
const fq=v=>(+v).toLocaleString('it-IT',{maximumFractionDigits:4});
const numIn=v=>v===''||v==null?'':String(v).replace('.',',');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');

function parseNum(s){s=String(s??'').replace(/[€\s ']/g,'').replace(/^\+/,'');if(!s)return NaN;let neg=false;if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1)}
 const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
 if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
 else if(lc>-1){s=s.replace(/\./g,'').replace(',','.')}
 else if(ld>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
 const v=parseFloat(s);return neg?-v:v}
function parseDate(s){s=String(s??'').trim().replace(/^"|"$/g,'');let m,y,mo,d;
 if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+m[1];mo=+m[2];d=+m[3]}
 else if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000}
 else return null;
 if(mo<1||mo>12||d<1||d>31)return null;return `${y}-${pad(mo)}-${pad(d)}`}

/* ---------- calcoli ---------- */
function kind(m){if(m.type==='tr')return 'tr';if(m.type==='out')return 'spesa';if(m.type==='inv')return 'inv';if(m.cat==='Disinvestimento')return 'disinv';if(m.cat==='Rendimento investimenti')return 'rend';if(m.cat==='Stipendio')return 'stip';if(EXTRA_CATS.includes(m.cat))return 'extra';if(m.cat==='Rimborso')return 'rimb';return 'entr'}
function agg(list){const o={stip:0,extra:0,entr:0,rimb:0,spese:0,straord:0,inv:0,disinv:0,rend:0,tr:0};
 for(const m of list){const k=kind(m),a=+m.amount||0;if(k==='spesa'){o.spese+=a;if(m.straord)o.straord+=a}else o[k]+=a}
 o.entrate=o.stip+o.extra+o.entr;o.netta=o.spese-o.rimb;o.nettaOrd=o.netta-o.straord;o.risp=o.entrate-o.netta;o.tasso=o.entrate?o.risp/o.entrate:null;return o}
const byMonth=k=>S.movs.filter(m=>m.date.startsWith(k));
const inRange=(a,b)=>S.movs.filter(m=>m.date>=a&&m.date<=b);
function lastMovK(){let mx='';for(const m of S.movs)if(m.date>mx)mx=m.date;return mx?mx.slice(0,7):curK()}
function completeMonths(){let mx='';for(const m of S.movs)if(m.date>mx)mx=m.date;if(!mx)return shiftK(curK(),-1);
 const lk=mx.slice(0,7);let lastFull=+mx.slice(8)>=27?lk:shiftK(lk,-1);const cap=shiftK(curK(),-1);return lastFull>cap?cap:lastFull}
function catSpend(list){const o={};for(const m of list)if(m.type==='out')o[m.cat]=(o[m.cat]||0)+m.amount;return Object.entries(o).sort((a,b)=>b[1]-a[1])}
const colorOf=i=>css(COLORS[i%COLORS.length]);
const catColorCache={};
function catColor(c){if(!(c in catColorCache)){const all=catSpend(S.movs).map(x=>x[0]);let i=all.indexOf(c);if(i<0){i=0;for(const ch of c)i=(i*31+ch.charCodeAt(0))>>>0}catColorCache[c]=i%COLORS.length}return colorOf(catColorCache[c])}

/* ETF */
function etfStats(e,upTo){const ops=e.ops.filter(o=>!upTo||o.date<=upTo).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);let qty=0,cost=0;
 for(const o of ops){if(o.qty>0){qty+=o.qty;cost+=o.qty*o.price+(o.fee||0)}else{const q=Math.min(-o.qty,qty);const avg=qty?cost/qty:0;cost-=avg*q;qty-=q}}
 return{qty,cost:Math.max(0,cost)}}
const sortedHist=e=>(e.hist||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
function curPrice(e){const h=sortedHist(e);if(h.length)return h[h.length-1].p;const o=e.ops.slice().sort((a,b)=>a.date<b.date?-1:1);return o.length?o[o.length-1].price:0}
function priceDate(e){const h=sortedHist(e);return h.length?h[h.length-1].d:null}
function priceAt(e,d){let p=null;for(const x of sortedHist(e))if(x.d<=d)p=x.p;if(p==null)for(const o of e.ops.slice().sort((a,b)=>a.date<b.date?-1:1))if(o.date<=d)p=o.price;return p}
function etfRows(){return S.etfs.map((e,i)=>{const st=etfStats(e),p=curPrice(e),v=st.qty*p;return{e,st,p,v,g:v-st.cost,c:colorOf(i)}})}
function coreEtf(){const r=etfRows();return(r.find(x=>x.e.role==='core')||r.sort((a,b)=>b.v-a.v)[0]||null)}
const lastOf=h=>{const s=(h||[]).slice().sort((a,b)=>a.d<b.d?-1:1);return s.length?s[s.length-1]:null};
function loanCalc(l){const P=+l.principal||0,n=Math.max(1,Math.round(+l.months||1)),r=(+l.tan||0)/1200;const rata=r?P*r/(1-Math.pow(1+r,-n)):P/n;const st=pd(l.start);const t=today();let res=P,paid=0,intLeft=0;const rows=[];
 for(let i=0;i<n;i++){const d=iso(addMonths(st,i));const it=res*r;const cap=rata-it;res=Math.max(0,res-cap);const isPaid=d<=t;if(isPaid)paid++;else intLeft+=it;rows.push({n:i+1,d,it,cap,res,paid:isPaid})}
 return{rata,rows,paid,n,residuo:paid?rows[paid-1].res:P,intTot:rata*n-P,intLeft,next:rows[paid]||null}}
function wealth(){const cash=lastOf(S.cash.hist),com=lastOf(S.cometa.hist);const etf=sum(etfRows(),x=>x.v);const debt=sum(S.loans,l=>loanCalc(l).residuo);
 return{cash:cash?cash.v:0,cashD:cash&&cash.d,etf,cometa:com?com.v:0,cometaD:com&&com.d,debt,tot:(cash?cash.v:0)+etf+(com?com.v:0)-debt}}
function fee(amount){const s=S.settings;return Math.min(s.feeMax,Math.max(s.feeMin,amount*s.feePct/100))}

const Q={busy:false,last:null,err:'',timer:null};
const PROV={td:{name:'Twelve Data',min:2,ex:'VWCE:XETR'},av:{name:'Alpha Vantage',min:30,ex:'VWCE.DEX'}};
function provKey(){const s=S.settings;return s.provider==='td'?s.tdKey:s.provider==='av'?s.avKey:''}
function setPrice(e,p,d,t){const h=e.hist.find(x=>x.d===d);if(h){h.p=p;if(t)h.t=t}else e.hist.push(t?{d,p,t}:{d,p})}
async function quote(sym){const s=S.settings,k=provKey();
 if(s.provider==='td'){const[sy,ex]=sym.split(':');const r=await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(sy)}${ex?`&mic_code=${encodeURIComponent(ex)}`:''}&apikey=${encodeURIComponent(k)}`);const j=await r.json();
  if(j.status==='error'||j.code)throw new Error(j.message||'Simbolo non trovato');const p=parseFloat(j.close);if(!(p>0))throw new Error('Prezzo non disponibile');
  return{p,d:(j.datetime||today()).slice(0,10),chg:parseFloat(j.percent_change)/100,cur:j.currency}}
 const r=await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(sym)}&apikey=${encodeURIComponent(k)}`);const j=await r.json();
 if(j.Note||j.Information)throw new Error('Limite di richieste raggiunto');const g=j['Global Quote'];const p=g?parseFloat(g['05. price']):NaN;if(!(p>0))throw new Error('Simbolo non trovato');
 return{p,d:g['07. latest trading day']||today(),chg:parseFloat(String(g['10. change percent']||'').replace('%',''))/100}}
async function refreshQuotes(manual){const s=S.settings;if(s.provider==='none'||!provKey()){if(manual)toast('Imposta prima le quotazioni automatiche in Dati e impostazioni',4000);return}
 if(Q.busy)return;Q.busy=true;Q.err='';let ok=0;const list=S.etfs.filter(e=>e.sym||e.ticker);
 for(const e of list){try{const q=await quote(e.sym||e.ticker);const t=new Date().toTimeString().slice(0,5);setPrice(e,q.p,q.d,t);e.chg=isFinite(q.chg)?q.chg:null;ok++}
  catch(err){Q.err=(err&&err.message==='Failed to fetch')||err instanceof TypeError?'Le quotazioni automatiche non sono raggiungibili da questa versione: usa l\'app installata':`${e.ticker||e.name}: ${err.message}`;if(err instanceof TypeError)break}}
 Q.busy=false;if(ok){Q.last=new Date();save()}if(manual)toast(Q.err||`Prezzi aggiornati (${ok} su ${list.length})`,Q.err?6000:2600);
 if(!$('#ov').classList.contains('open')&&(tab==='patrimonio'||tab==='home'))render()}
function marketOpen(){const n=new Date();const d=n.getDay();const m=n.getHours()*60+n.getMinutes();return d>=1&&d<=5&&m>=8*60+55&&m<=17*60+40}
function startQuotes(){clearInterval(Q.timer);const s=S.settings;if(s.provider==='none'||!provKey())return;

function drawMovList(){const q=mf.q.trim().toLowerCase();

 l.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);const total=l.length;const shown=l.slice(0,500);
 if(!shown.length){$('#movlist').innerHTML='<p class="note" style="padding:20px 4px">Nessun movimento corrisponde ai filtri.</p>';return}
 const g={};shown.forEach(m=>{const k=m.date.slice(0,7);(g[k]=g[k]||[]).push(m)});
 let h=`<p class="note" style="margin-top:10px">${total} movimenti${total>500?', mostrati i 500 più recenti':''} · spese ${eur0(sum(l.filter(m=>m.type==='out'),m=>m.amount))}</p>`;
 for(const k of Object.keys(g)){const a=agg(g[k]);h+=`<div class="grouphead"><b>${esc(monthLabel(k))}</b><span class="note num"><span class="pos">+${eur0(a.entrate+a.rimb)}</span> &nbsp; <span class="neg">−${eur0(a.spese)}</span></span></div><div class="glass list">${g[k].map(rowHTML).join('')}</div>`}

 return `<button class="row" data-id="${m.id}"><span class="ico" style="background:${col}">${esc((m.cat||'?').slice(0,2).toUpperCase())}</span><div class="main"><div class="t">${esc(m.desc||m.cat)}</div><div class="s">${esc(m.cat)}${m.type==='inv'?' · investimento':''}${m.straord?' · straordinaria':''} · ${fmtDate(m.date)}</div></div><div class="amt num ${cls}">${sign}${eur(m.amount)}</div></button>`}

function insights(){const out=[],s=S.settings,W=wealth(),R=etfRows(),V=sum(R,x=>x.v);
 const add=(lv,title,text,action)=>out.push({lv,title,text,action});
 // liquidità
 const accTot=sum(s.acc,a=>a.amount),soglia=s.reserve+accTot;
 if(W.cashD){const ex=W.cash-soglia;
  if(W.cash<s.reserve)add('bad','Riserva sotto la soglia',`Sul conto hai ${eur0(W.cash)}, sotto la riserva di ${eur0(s.reserve)}. Rimanda i prossimi acquisti finché non torni sopra.`);
  else if(ex>=s.minOrder){const core=coreEtf();let t=`Sul conto hai ${eur0(W.cash)}: tolti riserva${accTot?' e accantonamenti':''} (${eur0(soglia)}) restano ${eur0(ex)}.`;
   if(core&&core.p){const q=Math.floor((ex-fee(ex))/core.p);const f=fee(q*core.p);t+=` A ${eur(core.p)} sono ${q} quote di ${core.e.ticker||core.e.name} per ${eur0(q*core.p)}, commissione circa ${eur(f)} (${pct(f/(q*core.p),2)}).`}
   add('act',`Puoi investire ${eur0(ex)}`,t+' Usa un ordine con limite, tra le 10 e le 17.')}
  else if(ex>0)add('info','Eccedenza ancora piccola',`Sopra la soglia ci sono ${eur0(ex)}. Aspetta di arrivare a ${eur0(s.minOrder)}: con la commissione minima di ${eur(s.feeMin)} un ordine piccolo costa ${pct(s.feeMin/Math.max(ex,1),1)}.`);
  if(daysSince(W.cashD)>30)add('info','Aggiorna il saldo del conto',`L'ultimo saldo è del ${fmtDate(W.cashD)}. Aggiornalo per avere consigli sull'eccedenza corretti.`,{label:'Aggiorna saldo',fn:'cash'})}
 else add('info','Inserisci il saldo del conto','Serve per calcolare quanto puoi investire sopra la riserva.',{label:'Inserisci saldo',fn:'cash'});
 // satellite
 if(V>0)for(const x of R)if(x.e.role==='sat'){const w=x.v/V;if(w>s.satMax/100)add('warn',`${x.e.ticker||x.e.name} sopra il ${s.satMax}%`,`Pesa il ${pct(w)} degli ETF. Non vendere: compra solo il core finché non torna sotto il limite.`);
  else add('good',`${x.e.ticker||x.e.name} al ${pct(w)} degli ETF`,`Sotto il limite del ${s.satMax}% che ti sei dato. Con i nuovi acquisti solo sul core scenderà da solo.`)}
 // prezzi vecchi
 for(const x of R){const d=priceDate(x.e);if(d&&daysSince(d)>21)add('info',`Prezzo di ${x.e.ticker||x.e.name} da aggiornare`,`L'ultimo prezzo è del ${fmtDate(d)}: il valore del patrimonio potrebbe essere diverso.`,{label:'Aggiorna prezzo',fn:'etf:'+x.e.id})}
 // risparmio
 const lf=completeMonths();const k3=[0,1,2].map(i=>shiftK(lf,-i)),k12=[];for(let i=3;i<15;i++)k12.push(shiftK(lf,-i));
 const a3=agg(k3.flatMap(byMonth)),a12=agg(k12.flatMap(byMonth));
 if(a3.entrate&&a12.entrate){const t3=a3.risp/a3.entrate,t12=a12.risp/a12.entrate;
  if(t3<t12-.05)add('warn','Stai risparmiando meno del solito',`Negli ultimi 3 mesi hai messo da parte il ${pct(t3)} delle entrate, contro il ${pct(t12)} dei 12 mesi prima.`);
  else if(t3>=.2)add('good',`Risparmi il ${pct(t3)} delle entrate`,`Media degli ultimi 3 mesi completi${t3>t12?`, meglio del ${pct(t12)} dei 12 mesi prima`:''}. Sopra il 20% è un ottimo ritmo.`);
  else add('info',`Risparmi il ${pct(t3)} delle entrate`,`Ultimi 3 mesi completi, contro il ${pct(t12)} dei 12 mesi prima. Un obiettivo comune è il 20%.`)}
 // categorie in crescita
 const lastCats=catSpend(byMonth(lf)),prevK=[1,2,3,4,5,6].map(i=>shiftK(lf,-i));
 const prevAvg={};for(const[c,v]of catSpend(prevK.flatMap(byMonth)))prevAvg[c]=v/6;
 const ups=lastCats.filter(([c,v])=>c!==S.settings.cardCat&&v-(prevAvg[c]||0)>80&&v>(prevAvg[c]||0)*1.4).slice(0,3);
 for(const[c,v]of ups)add('warn',`${c}: spesa in aumento`,`A ${monthLabel(lf)} hai speso ${eur0(v)} in ${c}, contro una media di ${eur0(prevAvg[c]||0)} al mese nei 6 mesi prima.`);
 // budget
 for(const[c,b]of Object.entries(s.budgets||{})){if(!(b>0))continue;const v=sum(byMonth(curK()).filter(m=>m.type==='out'&&m.cat===c),m=>m.amount);if(v>b)add('bad',`Budget ${c} superato`,`Questo mese ${eur0(v)} su ${eur0(b)}.`);else if(v>b*.8)add('warn',`Budget ${c} quasi finito`,`Questo mese ${eur0(v)} su ${eur0(b)}.`)}
 // ricorrenti
 const rec=recurring();if(rec.length){const tot=sum(rec,r=>r.avg);add('info',`Spese ricorrenti: circa ${eur0(tot)} al mese`,rec.slice(0,6).map(r=>`${r.name} ${eur0(r.avg)}`).join(' · ')+'. Controlla ogni tanto se ti servono ancora tutte.')}
 // saldo carta senza categorie
 const l12=[];for(let i=0;i<12;i++)l12.push(shiftK(lf,-i));const sp12=catSpend(l12.flatMap(byMonth)),tot12=sum(sp12,x=>x[1]),card=S.settings.cardCat,amex=(sp12.find(x=>x[0]===card)||[0,0])[1];
 if(tot12&&amex/tot12>.25)add('info',`${card} è il ${pct(amex/tot12,0)} delle spese`,`Il saldo della carta arriva come un unico movimento, quindi quelle spese non hanno una categoria. Per analisi più precise registra le spese grosse della carta con la loro categoria e il saldo ${card} solo per la differenza.`);
 // busta senza accredito
 for(const p of S.payslips){const k=p.month,n=shiftK(k,1);const has=S.movs.some(m=>kind(m)==='stip'&&(m.date.startsWith(k)||m.date.startsWith(n)&&m.date.slice(8)<='10'));if(!has&&k>=shiftK(curK(),-3))add('act',`Accredito di ${monthLabel(k)} non registrato`,`Hai la busta paga da ${eur(p.netto)} ma nessun movimento Stipendio${p.rimborsi?`. Ricorda che ${eur(p.rimborsi)} sono rimborso spese`:''}.`,{label:'Registra accredito',fn:'sal:'+p.id})}
 // fondo pensione
 const mo=new Date().getMonth()+1;if(mo>=10&&s.cometaAnnuo>0){const m=5164.57-s.cometaAnnuo;if(m>500)add('info',`${fundName()}: margine deducibile`,`Quest'anno versi circa ${eur0(s.cometaAnnuo)} deducibili su un tetto di 5.164,57 €. Un versamento extra entro il 31 dicembre ti farebbe risparmiare circa il 33% di IRPEF su ogni euro, ma resta vincolato fino alla pensione.`)}
 // dati vecchi
 const lm=S.movs.reduce((a,m)=>m.date>a?m.date:a,'');if(lm&&daysSince(lm)>20)add('info','Movimenti da aggiornare',`L'ultimo movimento registrato è del ${fmtDate(lm)}. Importa l'estratto conto o aggiungi i movimenti mancanti.`,{label:'Importa CSV',fn:'import'});
 const ord={bad:0,act:1,warn:2,good:3,info:4};return out.sort((a,b)=>ord[a.lv]-ord[b.lv])}
function recurring(){const lf=completeMonths(),ks=[0,1,2,3,4,5].map(i=>shiftK(lf,-i));const g={};
 for(const m of ks.flatMap(byMonth))if(m.type==='out'&&m.cat!==S.settings.cardCat&&!/aliment|cibo|ristor|shopping|spesa/i.test(m.cat)&&m.cat!=='Shopping'){const key=(m.desc||m.cat).toLowerCase().replace(/\d+/g,'').trim()||m.cat.toLowerCase();(g[key]=g[key]||{name:m.desc||m.cat,months:new Set(),tot:0}).months.add(m.date.slice(0,7));g[key].tot+=m.amount}
 return Object.values(g).filter(x=>x.months.size>=4).map(x=>({name:x.name,avg:x.tot/x.months.size})).sort((a,b)=>b.avg-a.avg)}
function tipHTML(t){const L={act:'Da fare',warn:'Attenzione',bad:'Urgente',good:'Bene',info:'Info'};return `<div class="tip lv-${t.lv}"><i class="stripe"></i><div style="min-width:0"><span class="chip">${L[t.lv]}</span><div class="tt">${esc(t.title)}</div><div class="tx">${esc(t.text)}</div>${t.action?`<div class="act"><button class="btn ghost sm" data-tipfn="${esc(t.action.fn)}">${esc(t.action.label)}</button></div>`:''}</div></div>`}

 `<section class="blk glass card"><div class="headrow"><div><h2>Budget mensili</h2><p class="sub">Facoltativi: ti avviso quando ti avvicini al limite.</p></div><button class="btn ghost sm" id="editbud">Modifica</button></div>
 ${Object.entries(S.settings.budgets).filter(([c,b])=>b>0).map(([c,b])=>{const v=sum(byMonth(curK()).filter(m=>m.type==='out'&&m.cat===c),m=>m.amount);return `<div style="padding:8px 0;border-top:1px solid var(--glass-line)"><div style="display:flex;justify-content:space-between"><span>${esc(c)}</span><span class="num"><b>${eur0(v)}</b> / ${eur0(b)}</span></div><div class="bar"><i style="width:${Math.min(100,v/b*100)}%;background:${v>b?'var(--neg)':v>b*.8?'var(--warn)':'var(--pos)'}"></i></div></div>`}).join('')||'<p class="note">Nessun budget impostato.</p>'}</section>
 <p class="note" style="margin:6px 2px 0">I consigli sono calcoli automatici sui tuoi dati, non consulenza finanziaria.</p>`;
 bindTipActions();$('#editbud').onclick=budgetSheet}
function budgetSheet(){const lf=completeMonths();const ks=[0,1,2,3,4,5].map(i=>shiftK(lf,-i));const avg={};for(const[c,v]of catSpend(ks.flatMap(byMonth)))avg[c]=v/6;const cats=Object.keys(avg).slice(0,14);

 $('#bsv').onclick=()=>{const b={};$$('[data-bc]').forEach(i=>{const v=parseNum(i.value);if(v>0)b[i.dataset.bc]=v});S.settings.budgets=b;save();closeSheet();render();toast('Budget salvati')}}

const dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function offerFile(name,text,mime){const dl=await dlP;
 if(dl){try{await dl.save({filename:name,data:text});toast('File salvato')}catch(err){toast(err&&err.code==='declined'?'Salvataggio annullato':'Non riesco a salvare il file qui')}return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'application/octet-stream'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('File scaricato')}catch(e){toast('Download non disponibile qui')}}
function parseCSV(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
 const sep=[';','\t',','].map(s=>[s,first.split(s).length]).sort((a,b)=>b[1]-a[1])[0][0];const rows=[];let row=[],f='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
 if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function csvToMovs(text){const rows=parseCSV(text);if(!rows.length)return{error:'Il file è vuoto'};
 let h=rows[0].map(x=>x.trim().toLowerCase()),body=rows.slice(1);if(parseDate(rows[0][0])){h=['data','tipo','categoria','descrizione','importo'];body=rows}
 const f=(...n)=>h.findIndex(x=>n.some(k=>x.includes(k)));
 const iD=f('data','date'),iT=f('tipo','type','segno'),iC=f('categ','category'),iS=f('descr','causale','dettagl','note','memo','title','titolo'),iA=f('importo','amount','ammontare','valore'),iI=f('entrat','avere','accredit','credit'),iO=f('uscit','dare','addebit','debit');
 if(iD<0)return{error:'Non trovo una colonna con la data'};if(iA<0&&iI<0&&iO<0)return{error:'Non trovo una colonna con gli importi'};
 const out=[];let skipped=0;
 for(const r of body){const date=parseDate(r[iD]);let amt=NaN,type=null;
  if(iA>=0&&(r[iA]||'').trim())amt=parseNum(r[iA]);else{const a=iI>=0?parseNum(r[iI]):NaN,b=iO>=0?parseNum(r[iO]):NaN;if(a&&!isNaN(a)){amt=Math.abs(a);type='in'}else if(b&&!isNaN(b)){amt=Math.abs(b);type='out'}}
  if(!date||isNaN(amt)||amt===0){skipped++;continue}
  if(!type){const tv=iT>=0?(r[iT]||'').toLowerCase().trim():'';if(/^(invest)/.test(tv))type='inv';else if(/^(giro|trasf|transfer)/.test(tv))type='tr';else if(/^(entr|in\b|e$|\+|accr|avere|credit|income)/.test(tv))type='in';else if(/^(usc|spes|out|u$|-|addeb|dare|debit|expense)/.test(tv))type='out';else type=amt<0?'out':'in'}
  out.push({id:uid(),date,type,amount:Math.round(Math.abs(amt)*100)/100,cat:(iC>=0&&(r[iC]||'').trim())||'Altro',desc:iS>=0?(r[iS]||'').trim().replace(/\s+/g,' ').slice(0,140):'',acct:mainAcct()})}
 return{movs:out,skipped}}
async function readText(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){return new TextDecoder('windows-1252').decode(buf)}}
const csvQ=s=>/[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
function movCSV(){const L=['data;tipo;categoria;descrizione;importo'];S.movs.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(m=>L.push([m.date,m.type==='in'?'entrata':m.type==='inv'?'investimento':m.type==='tr'?'giroconto':'uscita',csvQ(m.cat),csvQ(m.type==='tr'?`${m.acct||''} → ${m.to||''}${m.desc?' · '+m.desc:''}`:(m.desc||'')),m.amount.toFixed(2).replace('.',',')].join(';')));return '﻿'+L.join('\r\n')}
async function loadSeed(){try{const r=await fetch('storico.json',{cache:'no-store'});if(!r.ok)return null;const j=await r.json();const ok=j&&Array.isArray(j.movs);if(ok)seedAvail=true;return ok?j:null}catch(e){return null}}
/* storico iniziale: unisce una versione più recente senza perdere quello che hai aggiunto a mano */
const OLD_SEED_ID=/^m\d{3}$/;
function mergeSeed(sd){const key=m=>m.date+'|'+(+m.amount).toFixed(2)+'|'+m.type;const fresh=new Set(sd.movs.map(key)),ids=new Set(sd.movs.map(m=>m.id));
 const mine=S.movs.filter(m=>!OLD_SEED_ID.test(m.id)&&!ids.has(m.id)&&!fresh.has(key(m)));
 S.movs=[...sd.movs,...mine];
 for(const p of sd.payslips||[])if(!S.payslips.some(x=>x.month===p.month))S.payslips.push(p);
 const mergeH=(a,b)=>{const o={};for(const h of[...(b||[]),...(a||[])])o[h.d]=h;return Object.values(o)};
 S.cash.hist=mergeH(S.cash.hist,sd.cash&&sd.cash.hist);S.cometa.hist=mergeH(S.cometa.hist,sd.cometa&&sd.cometa.hist);
 if(!S.etfs.length)S.etfs=norm(sd).etfs;
 S.ivySeen=[...new Set([...(sd.ivySeen||[]),...S.ivySeen])];S.rev=sd.rev||0;
 const ss=sd.settings||{};for(const k of['name','cardCat','ivyMap','accounts'])if(ss[k]!==undefined&&JSON.stringify(S.settings[k])===JSON.stringify(DEF_SET[k]))S.settings[k]=ss[k];
 if(sd.cometa&&sd.cometa.name&&!S.cometa.name)S.cometa.name=sd.cometa.name;return S.movs.length}

/* import diretto del backup di Ivy Wallet (.zip) */
function decodeJSONBytes(u){if(u[0]===0xFF&&u[1]===0xFE)return new TextDecoder('utf-16le').decode(u.subarray(2));if(u[0]===0xFE&&u[1]===0xFF)return new TextDecoder('utf-16be').decode(u.subarray(2));return new TextDecoder('utf-8').decode(u).replace(/^﻿/,'')}
async function readIvy(file){let text;
 if(/\.zip$/i.test(file.name)||file.type.includes('zip')){if(!window.JSZip)throw new Error('Serve la connessione per aprire lo zip');const z=await JSZip.loadAsync(file);const f=Object.values(z.files).find(x=>!x.dir&&/\.json$/i.test(x.name));if(!f)throw new Error('Nello zip non c\'è il file dei dati');text=decodeJSONBytes(await f.async('uint8array'))}
 else text=decodeJSONBytes(new Uint8Array(await file.arrayBuffer()));
 const j=JSON.parse(text);if(!j||!Array.isArray(j.transactions)||!Array.isArray(j.accounts))throw new Error('Non è un backup di Ivy Wallet');return j}
const IVY_KINDS=[['cash','Conto / liquidità'],['inv','Investimenti'],['skip','Ignora']];
function ivyGuess(name){return /etf|pac|invest|fond|broker|trade|azion|crypto|cripto/i.test(name)?'inv':/prestit|loan|debit|credit/i.test(name)?'skip':'cash'}
function ivyKinds(j){const m=S.settings.ivyMap||{};const o={};for(const a of j.accounts)o[a.id]=m[a.name]||ivyGuess(a.name);return o}
function ivyToMovs(j,K){const A={},C={};j.accounts.forEach(a=>A[a.id]=a.name);(j.categories||[]).forEach(c=>C[c.id]=c.name);
 const kOf=id=>A[id]===undefined?'skip':K[id];
 const fix=c=>c==='Loans'?'Prestiti':c;const seen=new Set(S.ivySeen);const have=new Set(S.movs.map(m=>m.date+'|'+(+m.amount).toFixed(2)+'|'+m.type));
 const out=[],newSeen=[];let skipped=0;
 // un versamento registrato come spesa sul conto e come entrata sul conto investimenti (stesso giorno e importo) è un investimento
 const invIn=new Set(j.transactions.filter(t=>t.type==='INCOME'&&kOf(t.accountId)==='inv').map(t=>iso(new Date(t.dateTime))+'|'+t.amount));
 for(const t of j.transactions){if(!t.dateTime||seen.has(t.id))continue;newSeen.push(t.id);
  const date=iso(new Date(t.dateTime)),acct=A[t.accountId]||'',to=A[t.toAccountId]||'',ka=kOf(t.accountId),kb=t.toAccountId?kOf(t.toAccountId):null,cat=fix(C[t.categoryId]||''),title=(t.title||'').trim(),amt=Math.round(t.amount*100)/100;let m=null;
  if(/adjust balance|rettifica|saldo iniziale/i.test(title)){}
  else if(t.type==='TRANSFER'){if(ka==='cash'&&kb==='inv')m={type:'inv',cat:/pac|fond/i.test(to)?'PAC fondi':'ETF',desc:to};else if(ka==='inv'&&kb==='cash')m={type:'in',cat:'Disinvestimento',desc:'Disinvestimento da '+acct};else if(ka==='cash'&&kb==='cash')m={type:'tr',cat:'Giroconto',desc:title,to}}
  else if(ka!=='cash'){}
  else if(t.type==='INCOME'){if(cat==='Stipendio'){const dd=new Date(t.dateTime);const c=/13|tredicesim/i.test(title)||(dd.getMonth()===11&&dd.getDate()>=10&&dd.getDate()<=22)?'Tredicesima':/scuola|bonus|premio|una tantum/i.test(title)?'Extra stipendio':'Stipendio';m={type:'in',cat:c,desc:title}}
   else if(/invest/i.test(cat))m={type:'in',cat:'Rendimento investimenti',desc:title||'Rendimento'};else if(/conguagl|freelance|videomaker|vendit|regal|altre entrate/i.test(cat))m={type:'in',cat:'Altre entrate',desc:title||cat};else m={type:'in',cat:'Rimborso',desc:[title,cat].filter(Boolean).join(' · ')}}
  else if(t.type==='EXPENSE'){if(!cat&&/adjust|rettific/i.test(title)){}else if(/invest/i.test(cat)&&invIn.has(date+'|'+t.amount))m={type:'inv',cat:'PAC fondi',desc:title||'Versamento'};else m={type:'out',cat:cat||'Altro',desc:title}}
  if(!m){skipped++;continue}
  const rec={id:t.id,date,amount:amt,acct:acct||mainAcct(),...m};if(have.has(rec.date+'|'+rec.amount.toFixed(2)+'|'+rec.type)){skipped++;continue}out.push(rec)}
 // saldo dei conti di liquidità (i trasferimenti verso conti eliminati non lo riducono)
 let bal=0,last='';for(const t of j.transactions){if(!t.dateTime)continue;const d=iso(new Date(t.dateTime));if(d>last)last=d;const ka=kOf(t.accountId),kb=t.toAccountId?kOf(t.toAccountId):null;
  if(t.type==='INCOME'&&ka==='cash')bal+=t.amount;else if(t.type==='EXPENSE'&&ka==='cash')bal-=t.amount;else if(t.type==='TRANSFER'&&A[t.toAccountId]!==undefined){if(ka==='cash')bal-=t.amount;if(kb==='cash')bal+=(t.toAmount||t.amount)}}
 const names=[...new Set(j.accounts.filter(a=>Object.entries(K).some(([id,k])=>id===a.id&&k==='cash')).map(a=>a.name))];
 return{out,newSeen,skipped,bal:Math.round(bal*100)/100,last,names}}
function ivyMapSheet(j,then){const K=ivyKinds(j);const used={};j.transactions.forEach(t=>{used[t.accountId]=(used[t.accountId]||0)+1;if(t.toAccountId)used[t.toAccountId]=(used[t.toAccountId]||0)+1});
 openSheet(`<h3>Che tipo di conti sono?</h3><p class="note" style="margin-top:-6px">Serve per distinguere spese, giroconti e investimenti. Lo ricordo per le prossime importazioni.</p>
 <div style="margin-top:12px">${j.accounts.map(a=>`<label class="f">${esc(a.name)} <span style="font-weight:500">· ${used[a.id]||0} movimenti</span><select data-acc="${esc(a.id)}">${IVY_KINDS.map(([k,l])=>`<option value="${k}" ${K[a.id]===k?'selected':''}>${l}</option>`).join('')}</select></label>`).join('')}</div>
 <div class="actions"><button class="btn ghost" id="imx">Annulla</button><button class="btn" id="imok">Continua</button></div>`);
 $('#imx').onclick=closeSheet;$('#imok').onclick=()=>{const map={...(S.settings.ivyMap||{})};$$('[data-acc]').forEach(sel=>{const a=j.accounts.find(x=>x.id===sel.dataset.acc);K[a.id]=sel.value;map[a.name]=sel.value});S.settings.ivyMap=map;save();then(K)}}
let lastIvy=null;
async function importIvy(file){let j;try{j=await readIvy(file)}catch(e){toast(e.message||'File non valido',5000);return}lastIvy=j;
 ivyMapSheet(j,async K=>{const r=ivyToMovs(j,K);const nin=r.out.filter(m=>m.type==='in').length,ninv=r.out.filter(m=>m.type==='inv').length,ntr=r.out.filter(m=>m.type==='tr').length;
  if(!r.out.length){closeSheet();toast(r.newSeen.length?'Nessun movimento da importare':'Nessun movimento nuovo nel backup',4000);S.ivySeen.push(...r.newSeen);save();return}
  if(await ask(`Importare ${r.out.length} movimenti da Ivy Wallet?`,`${r.out.length-nin-ninv-ntr} spese, ${nin} entrate, ${ninv} investimenti, ${ntr} giroconti.${r.skipped?` ${r.skipped} tra rettifiche, movimenti dei conti investimento e doppioni saltati.`:''} Saldo liquidità secondo Ivy (${r.names.join(', ')}): ${eur(r.bal)} al ${r.last?fmtDate(r.last):'–'}.`,'Importa')){
   S.movs.push(...r.out);S.ivySeen.push(...r.newSeen);if(JSON.stringify(S.settings.accounts)===JSON.stringify(DEF_SET.accounts))S.settings.accounts=[...r.names];else for(const n of r.names)if(!S.settings.accounts.includes(n))S.settings.accounts.push(n);
   if(r.last){S.cash.hist=S.cash.hist.filter(h=>h.d!==r.last);S.cash.hist.push({d:r.last,v:r.bal})}
   save();mf={q:'',t:'all',m:'all',c:'all'};go('movimenti');toast(`Importati ${r.out.length} movimenti, saldo aggiornato`,4000)}})}
async function importCSVFile(file){if(/\.(xlsx?|ods|numbers)$/i.test(file.name)){toast('È un foglio di calcolo: esportalo in CSV e riprova',5000);return}
 const res=csvToMovs(await readText(file));if(res.error){toast(res.error,4000);return}
 const k=m=>m.date+'|'+m.amount.toFixed(2)+'|'+m.type;const ex=new Set(S.movs.map(k));const fresh=res.movs.filter(m=>!ex.has(k(m)));const dup=res.movs.length-fresh.length;
 if(!fresh.length){toast(`Nessun movimento nuovo (${dup} già presenti)`,5000);return}
 if(await ask(`Importare ${fresh.length} movimenti?`,`${dup?dup+' già presenti verranno saltati. ':''}${res.skipped?res.skipped+' righe senza data o importo verranno ignorate.':''}`,'Importa')){S.movs.push(...fresh);save();mf={q:'',t:'all',m:'all',c:'all'};go('movimenti');toast(`Importati ${fresh.length} movimenti`)}}
async function restoreFile(file){let j;try{j=JSON.parse(await readText(file))}catch(e){toast('Il file non è un backup valido');return}
 if(!j||!Array.isArray(j.movs)){toast('Il file non è un backup di questa app');return}
 if(await ask('Ripristinare il backup?',`Contiene ${j.movs.length} movimenti e ${(j.etfs||[]).length} ETF. I dati attuali verranno sostituiti.`,'Ripristina',true)){S=norm(j);save();applyTheme();go('home');startQuotes();toast('Backup ripristinato')}}

function quoteSheet(){const s=S.settings;let prov=s.provider;
 const draw=()=>{openSheet(`<h3>Quotazioni automatiche</h3><p class="note" style="margin-top:-6px">I prezzi degli ETF si aggiornano da soli mentre l'app è aperta e la borsa è aperta. Serve una chiave gratuita del fornitore. Funziona nell'app installata; la versione dentro Claude non può collegarsi a siti esterni.</p>
 <div class="seg" id="pvseg" style="margin-top:12px">${[['none','Spente'],['td','Twelve Data'],['av','Alpha Vantage']].map(([k,l])=>`<button data-pv="${k}" aria-pressed="${prov===k}">${l}</button>`).join('')}</div>
 ${prov==='td'?`<p class="note" style="margin-top:10px">twelvedata.com: piano gratuito con 800 richieste al giorno, aggiornamento ogni 2 minuti. I titoli europei possono essere ritardati o richiedere un'estensione a pagamento: prova prima il simbolo con "Cerca simbolo". Formato: VWCE:XETR o VWCE:XMIL.</p><label class="f" style="margin-top:10px">Chiave API Twelve Data<input id="pk" value="${esc(s.tdKey)}" autocomplete="off" spellcheck="false"></label>`:''}
 ${prov==='av'?`<p class="note" style="margin-top:10px">alphavantage.co: piano gratuito con 25 richieste al giorno, quindi aggiornamento ogni 30 minuti al massimo. Prezzo di chiusura o ritardato. Formato: VWCE.DEX per Xetra.</p><label class="f" style="margin-top:10px">Chiave API Alpha Vantage<input id="pk" value="${esc(s.avKey)}" autocomplete="off" spellcheck="false"></label>`:''}
 ${prov!=='none'?`<label class="f">Ogni quanti minuti<input id="pmin" inputmode="numeric" value="${Math.max(PROV[prov].min,s.refreshMin||5)}"></label>`:''}
 <div class="actions"><button class="btn" id="psv">Salva</button></div>`);
  $('#pvseg').onclick=e=>{const b=e.target.closest('[data-pv]');if(b){prov=b.dataset.pv;draw()}};
  $('#psv').onclick=()=>{s.provider=prov;if(prov==='td')s.tdKey=$('#pk').value.trim();if(prov==='av')s.avKey=$('#pk').value.trim();if($('#pmin')){const m=parseNum($('#pmin').value);if(m>0)s.refreshMin=m}save();closeSheet();startQuotes();render();
   toast(prov==='none'?'Quotazioni automatiche spente':'Quotazioni attive: imposta il simbolo di ogni ETF',4000)}};draw()}
let seedAvail=false;
function settingsSheet(){const st=S.settings;
 openSheet(`<h3>Dati e impostazioni</h3><p class="note" style="margin-top:-6px">${S.movs.length} movimenti, ${S.payslips.length} buste paga, ${S.etfs.length} ETF salvati su questo dispositivo${storageOk?'':'. Attenzione: il salvataggio qui non funziona, esporta un backup'}.</p>
 <div style="margin-top:14px"><div class="eyebrow">Tema</div><div class="seg" id="thseg2" style="margin-top:6px">${[['auto','Automatico'],['light','Chiaro'],['dark','Scuro']].map(([k,l])=>`<button data-th="${k}" aria-pressed="${st.theme===k}">${l}</button>`).join('')}</div></div>
 <div style="margin-top:18px"><div class="eyebrow">Profilo</div><div class="f2" style="margin-top:6px"><label class="f">Il tuo nome<input id="stname" value="${esc(st.name||'')}"></label><label class="f">Categoria del saldo carta<input id="stcard" value="${esc(st.cardCat||'')}" placeholder="Per esempio Carta di credito"></label></div>
  <label class="f">Conti (il primo è quello principale), separati da virgola<input id="accl2" value="${esc((st.accounts||[]).join(', '))}"></label></div>
 <div style="margin-top:18px"><div class="eyebrow">Quotazioni</div><div class="actions" style="margin-top:6px"><button class="btn ghost" id="goq">Quotazioni automatiche: ${st.provider==='none'?'spente':PROV[st.provider].name}</button></div></div>
 <div style="margin-top:18px"><div class="eyebrow">Importa</div><p class="note" style="margin:6px 0">Dal backup di Ivy Wallet (il file .zip che esporti dall'app) o da un CSV con data, tipo, categoria, descrizione, importo. I movimenti già presenti vengono saltati.</p>
  <div class="actions" style="margin-top:6px"><button class="btn" id="pickivy">Backup Ivy Wallet (.zip)</button><button class="btn ghost" id="pickcsv">File CSV</button></div>
  <div class="actions" style="margin-top:8px"><button class="btn ghost sm" id="tpl">Scarica modello CSV</button>${lastIvy?'<button class="btn ghost sm" id="ivymap">Tipi di conto Ivy</button>':''}</div></div>
 <div style="margin-top:18px"><div class="eyebrow">Esporta e backup</div><p class="note" style="margin:6px 0">I dati restano solo su questo dispositivo. Il backup completo contiene tutto (movimenti, buste paga, ETF, impostazioni) e si ripristina su un altro telefono; il CSV contiene solo i movimenti e si apre con Excel.</p>
  <div class="actions" style="margin-top:6px"><button class="btn" id="expjson">Scarica backup completo</button><button class="btn ghost" id="pickjson">Ripristina backup</button></div>
  <div class="actions" style="margin-top:8px"><button class="btn ghost" id="expcsv">Esporta movimenti CSV</button>${seedAvail?'<button class="btn ghost" id="reseed">Ricarica storico iniziale</button>':''}</div></div>
 <div style="margin-top:18px"><div class="eyebrow">Cancella</div><div class="actions" style="margin-top:6px"><button class="btn danger" id="wipe">Cancella tutti i dati</button></div></div>
 <input type="file" id="fpick" hidden>`);
 const pick=(acc,fn)=>{const f=$('#fpick');f.accept=acc;f.onchange=async ev=>{const file=ev.target.files[0];ev.target.value='';if(file)fn(file)};f.click()};
 $('#thseg2').onclick=e=>{const b=e.target.closest('[data-th]');if(!b)return;st.theme=b.dataset.th;save();applyTheme();$$('#thseg2 button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
 $('#stname').onchange=e=>{st.name=e.target.value.trim();save();render()};$('#stcard').onchange=e=>{st.cardCat=e.target.value.trim();save()};
 $('#accl2').onchange=e=>{st.accounts=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);save();toast('Conti salvati')};
 $('#goq').onclick=quoteSheet;
 $('#pickivy').onclick=()=>pick('.zip,.json,application/zip',importIvy);$('#pickcsv').onclick=()=>pick('.csv,.txt,text/csv',importCSVFile);$('#pickjson').onclick=()=>pick('.json,application/json',restoreFile);
 if($('#ivymap'))$('#ivymap').onclick=()=>ivyMapSheet(lastIvy,()=>{closeSheet();toast('Tipi di conto salvati per le prossime importazioni')});
 $('#tpl').onclick=()=>offerFile('modello-movimenti.csv','﻿data;tipo;categoria;descrizione;importo\r\n2026-11-27;entrata;Stipendio;Busta paga novembre;2750,00\r\n2026-11-03;uscita;Alimentari;Supermercato;64,30\r\n2026-11-05;giroconto;Giroconto;Prelievo bancomat;100,00\r\n2026-11-06;investimento;ETF;Acquisto ETF;2500,00\r\n','text/csv');
 $('#expjson').onclick=()=>offerFile(`backup-conti-${today()}.json`,JSON.stringify({app:'conti',v:2,esportato:new Date().toISOString(),...S}),'application/json');
 $('#expcsv').onclick=()=>offerFile(`movimenti-${today()}.csv`,movCSV(),'text/csv');
 if($('#reseed'))$('#reseed').onclick=async()=>{const sd=await loadSeed();if(!sd){toast('Lo storico iniziale non è disponibile');return}if(await ask('Ricaricare lo storico iniziale?','I dati attuali verranno sostituiti con lo storico iniziale.','Ricarica',true)){S=norm(sd);save();applyTheme();go('home')}};
 $('#wipe').onclick=async()=>{if(await ask('Cancellare tutti i dati?','Scarica prima un backup se vuoi conservarli.','Cancella tutto',true)){S=norm({settings:{theme:st.theme}});save();go('home');toast('Dati cancellati')}}}

/* ---------- avvio ---------- */
$$('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#gear').onclick=settingsSheet;$('#themebtn').onclick=themeSheet;$('#fab').onclick=()=>movForm();
$('#ov').onclick=e=>{if(e.target.id==='ov')closeSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ov').classList.contains('open'))closeSheet()});

window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(quickFromHash(t))return;if(TABS.includes(t)&&t!==tab){tab=t;render()}});
addEventListener('scroll',()=>$('#topbar').classList.toggle('scrolled',scrollY>70),{passive:true});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()})}catch(e){}
applyTheme();render();startQuotes();quickFromHash(startHash);
loadSeed().then(sd=>{if(!sd)return;
 if(firstRun&&!S.movs.length){S=norm(sd);save();applyTheme();render();toast('Caricato il tuo storico: '+S.movs.length+' movimenti')}
 else if((sd.rev||0)>(S.rev||0)){mergeSeed(sd);save();render();toast('Storico aggiornato',3000)}});
</script>
