/* Layout: app a una colonna stile One UI (titolo grande in alto, contenuto a portata di pollice, barra in basso), superfici in vetro e angoli vivi */
:root{
  --bg:#F3F3F0; --blob1:#BFD3FF; --blob2:#CDEBDD; --blob3:#F3D9E4;
  --ink:#141A24; --muted:#5D6778; --faint:#8A93A3;
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.86); --glass-line:rgba(20,30,50,.09); --glass-hi:rgba(255,255,255,.7);
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(47,107,255,.12);
  --pos:#14915A; --neg:#D93D44; --warn:#D9662B; --inc:#12B76A; --exp:#F04438; --info:#2F6BFF;
  --c1:#2F6BFF; --c2:#14A37F; --c3:#E08A1E; --c4:#C2417A; --c5:#7A5AE0; --c6:#2BA3C9; --c7:#8B9A2E; --c8:#9AA3B2;
  --shadow:0 10px 30px rgba(20,30,60,.08);
  --font:'SamsungOne','Samsung Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --gold:#B8912E; --gold-ink:#7A5C10; --gold-soft:rgba(212,175,55,.16); --gold-grad:linear-gradient(135deg,#ecdba5 0%,#D4AF37 38%,#a08429 62%,#D4AF37 82%,#e7d391 100%);
  --gutter-l:max(16px,env(safe-area-inset-left,0px)); --gutter-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --gold:#E8C45E; --gold-ink:#EDCD6E; --gold-soft:rgba(232,196,94,.15);
  --bg:#1B1D22; --blob1:#16306E; --blob2:#0F3B2E; --blob3:#3A1630;
  --ink:#F1F2F4; --muted:#B4B9C3; --faint:#8C929D;
  --glass:rgba(44,47,55,.72); --glass-strong:rgba(38,41,48,.95); --glass-line:rgba(255,255,255,.11); --glass-hi:rgba(255,255,255,.07);
  --accent:#6B9BFF; --accent-ink:#0A0D13; --accent-soft:rgba(107,155,255,.16);
  --pos:#43C98A; --neg:#FF6B70; --warn:#FF8F4D; --inc:#32D583; --exp:#F97066; --info:#6B9BFF;
  --c1:#6B9BFF; --c2:#3FCFA4; --c3:#F2A54A; --c4:#EE76A8; --c5:#A48CFF; --c6:#5CC6E8; --c7:#B9C85A; --c8:#7F8899;
  --shadow:0 6px 18px rgba(0,0,0,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --gold:#E8C45E; --gold-ink:#EDCD6E; --gold-soft:rgba(232,196,94,.15);
  --bg:#1B1D22; --blob1:#16306E; --blob2:#0F3B2E; --blob3:#3A1630;
  --ink:#F1F2F4; --muted:#B4B9C3; --faint:#8C929D;
  --glass:rgba(44,47,55,.72); --glass-strong:rgba(38,41,48,.95); --glass-line:rgba(255,255,255,.11); --glass-hi:rgba(255,255,255,.07);
  --accent:#6B9BFF; --accent-ink:#0A0D13; --accent-soft:rgba(107,155,255,.16);
  --pos:#43C98A; --neg:#FF6B70; --warn:#FF8F4D; --inc:#32D583; --exp:#F97066; --info:#6B9BFF;
  --c1:#6B9BFF; --c2:#3FCFA4; --c3:#F2A54A; --c4:#EE76A8; --c5:#A48CFF; --c6:#5CC6E8; --c7:#B9C85A; --c8:#7F8899;
  --shadow:0 6px 18px rgba(0,0,0,.22); color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;width:70vmax;height:70vmax;filter:blur(60px);opacity:.75;border-radius:50%}
.bgfx i:nth-child(1){background:var(--blob1);top:-30vmax;left:-20vmax}
.bgfx i:nth-child(2){background:var(--blob2);top:20vh;right:-35vmax}
.bgfx i:nth-child(3){background:var(--blob3);bottom:-40vmax;left:-10vmax;opacity:.5}
.num{font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 3px var(--gold-soft)}

/* barra in alto */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding-left:var(--gutter-l);padding-right:var(--gutter-r);background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border-bottom:1px solid transparent;transition:border-color .2s,background .2s}
.topbar .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;height:56px}
.topbar .small{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:1.05rem;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
.topbar.scrolled{border-bottom-color:var(--glass-line);background:var(--glass-strong)}
.topbar.scrolled .small{opacity:1;transform:none}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--glass-line);background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{position:relative;z-index:1;padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto}
.bigtitle{padding:10px 2px 16px;display:flex;flex-direction:column;justify-content:flex-end}
.bigtitle h1{font-size:2.35rem;line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0;text-wrap:balance}
.bigtitle p{margin:8px 0 0;color:var(--muted);max-width:52ch}

section.blk{margin:0 0 14px}
.card{padding:16px}
.card h2{font-size:1rem;font-weight:700;margin:0;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:.84rem;margin:2px 0 0}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lab{color:var(--muted);font-size:.8rem;font-weight:600;letter-spacing:.02em}
.eyebrow{color:var(--gold-ink);font-size:.82rem;font-weight:700;letter-spacing:0}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.note{color:var(--muted);font-size:.84rem;margin:0}

/* segmenti */
.seg{display:flex;padding:3px;gap:3px;border:1px solid var(--glass-line);background:var(--glass)}
.filters .seg{overflow-x:auto;scrollbar-width:none}.filters .seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 10px;font-size:.85rem;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#ftype button[data-v="out"][aria-pressed="true"]{background:var(--neg);color:var(--bg)}
#ftype button[data-v="in"][aria-pressed="true"]{background:var(--pos);color:var(--bg)}
#ftype button[data-v="tr"][aria-pressed="true"]{background:var(--gold-grad);color:#0B1020}
#ftype button[data-v="inv"][aria-pressed="true"]{background:var(--c5);color:#fff}
.pernav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.pernav b{font-size:1rem;text-transform:capitalize}
.pernav button{width:40px;height:40px;border:1px solid var(--glass-line);background:var(--glass);font-size:1.2rem}
.pernav button:disabled{opacity:.35;cursor:default}

/* hero */
.hero{padding:20px 18px;border-top:2px solid transparent;border-image:var(--gold-grad) 1}
.hero .big{font-size:2.5rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 2px}
.hero .meta{color:var(--muted);font-size:.86rem}
.split{display:flex;height:10px;margin:14px 0 4px;gap:2px;background:var(--glass-line)}
.split i{display:block;height:100%}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:619px){.tiles.t3>:last-child:nth-child(3){grid-column:span 2}}
@media (min-width:620px){.tiles.t4{grid-template-columns:repeat(4,minmax(0,1fr))}.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{padding:14px;min-width:0}
.tile .v{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .d{font-size:.78rem;font-weight:600;margin-top:2px;color:var(--muted)}
.chart{position:relative;height:240px}
.chart.sm{height:200px}.chart.lg{height:280px}
.legend{margin-top:10px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--glass-line);font-size:.9rem}
.lrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:10px;height:10px;flex:none}
.bar{height:6px;background:var(--glass-line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold-grad)}

/* liste */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--glass-line);background:none;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:var(--accent-soft)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;white-space:nowrap}
.ico{width:36px;height:36px;display:grid;place-items:center;flex:none;font-weight:800;font-size:.8rem;color:#fff}
.ico svg.i{width:19px;height:19px;stroke-width:2}
.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row.sel{background:var(--gold-soft)}
.row.sel .ico,.row.selable .ico{position:relative}
.row.sel .ico::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:var(--gold);color:#1a1405;font-size:1rem}
.selbar{position:fixed;left:var(--gutter-l,12px);right:var(--gutter-r,12px);top:calc(8px + env(safe-area-inset-top,0px));z-index:40;display:none;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;max-width:600px;margin:0 auto}
:root.native .selbar{top:calc(8px + var(--sat,0px))}
.selbar.open{display:flex}.selbar b{flex:1;text-align:center;font-size:.9rem}
.grouphead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:18px 2px 8px;font-size:.88rem}
.grouphead b{text-transform:capitalize}

/* tabelle */
.scrollx{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--glass-line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:.76rem;letter-spacing:.02em}
tr:last-child td{border-bottom:0}

/* consigli */
.tip{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--glass-line)}
.tip:last-child{border-bottom:0}
.tip .stripe{width:4px;flex:none}
.tip .tt{font-weight:800}
.tip .tx{color:var(--muted);font-size:.88rem;margin-top:3px}
.tip .act{margin-top:10px}
.chip{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;margin-bottom:6px}
.lv-act .stripe{background:var(--gold-grad)} .lv-act .chip{background:var(--gold-soft);color:var(--gold-ink)}
.lv-warn .stripe{background:var(--warn)} .lv-warn .chip{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.lv-bad .stripe{background:var(--neg)} .lv-bad .chip{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.lv-good .stripe{background:var(--pos)} .lv-good .chip{background:color-mix(in srgb,var(--pos) 14%,transparent);color:var(--pos)}
.lv-info .stripe{background:var(--faint)} .lv-info .chip{background:var(--glass-line);color:var(--muted)}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;padding:11px 16px;font-weight:800;background:var(--ink);color:var(--bg);text-align:center}
.btn.ghost{background:var(--glass);color:var(--ink);border-color:var(--glass-line)}
.btn.danger{background:none;color:var(--neg);border-color:var(--neg)}
.btn.dangerfill{background:var(--neg);color:#fff}
.btn.gold{background:var(--gold-grad);color:#0B1020;border-color:transparent}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.brand svg{flex:none}
.brand{flex:none}.topbar .iconbtn{flex:none}
@media (max-width:420px){.topbar .in{gap:6px}.topbar .iconbtn{width:38px;height:38px}.topbar .small{display:none}.brand{margin-right:auto}}
@media (max-width:350px){.brand .ver{display:none}}
.brand .ver{font-size:.68rem;font-weight:700;color:var(--gold-ink);border:1px solid var(--gold);padding:1px 5px;letter-spacing:.02em}
.goldline{border-top:2px solid transparent;border-image:var(--gold-grad) 1}
.iconbtn{position:relative}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;background:var(--neg);color:#fff;font-size:.62rem;font-weight:800;display:grid;place-items:center}
.ct{font:600 11px var(--font);fill:var(--muted)}
.cv{height:100%}
.cro{position:absolute;top:0;left:0;background:var(--ink);color:var(--bg);padding:8px 10px;font-size:.78rem;line-height:1.5;pointer-events:none;z-index:3;max-width:230px}
.cro .sw{display:inline-block;margin-right:6px;vertical-align:-1px}
.clg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.76rem;color:var(--muted);margin-top:6px}
.clg .sw{display:inline-block;margin-right:5px;vertical-align:-1px}
.acc-card{padding:16px;margin-bottom:12px}
.acc-card .bal{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.priv{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--glass-line)}
.resbox{margin-top:14px;padding:14px;border:1px solid var(--glass-line);background:var(--gold-soft)}
.resbox .big{font-size:2rem;font-weight:800;letter-spacing:-.03em;color:var(--gold-ink)}
.acc-card .spk{margin-top:10px}
.acc-card .hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.acc-card .sw{width:12px;height:12px;display:inline-block;margin-top:6px}
.pdfrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--glass-line)}
.pdfrow input{margin-top:4px;width:18px;height:18px;accent-color:var(--gold)}
.pdfrow input.dsc{flex:1;min-width:0;width:auto;height:auto;margin:0;padding:4px 8px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-weight:800;text-overflow:ellipsis}
.pdfrow input.dsc:focus{border-color:var(--gold);background:var(--glass);outline:0}
.infob{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold-ink);font:italic 800 .85rem Georgia,serif;display:grid;place-items:center;padding:0}
.sameask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 10px;border-radius:12px;background:var(--gold-soft);font-size:.85rem}
.sameask .btn{margin-left:6px}
.imptag{display:inline-block;padding:0 7px;border-radius:999px;border:1px solid var(--gold);color:var(--gold-ink);font-size:.7rem;font-weight:700;line-height:1.5;vertical-align:1px}
.welcome{display:flex;gap:16px;align-items:center;margin:8px 0 18px}
.welcome svg{flex:none;box-shadow:0 8px 24px rgba(160,132,41,.35)}
.welcome h1{margin:0;font-size:1.9rem;letter-spacing:-.03em;line-height:1.1}
.welcome p{margin:4px 0 0;color:var(--muted)}
.step{display:flex;gap:14px;align-items:center;width:100%;padding:14px 0;border:0;border-top:1px solid var(--glass-line);background:none;color:inherit;text-align:left;font:inherit;cursor:pointer}
.step .n{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1.5px solid var(--glass-line);color:var(--muted);font-weight:800}
.step.next .n{border-color:var(--gold);color:var(--gold-ink)}
.step.done .n{background:var(--gold-grad);border-color:transparent;color:#0B1020}
.step .t{display:block;font-weight:700}.step .s{display:block;font-size:.85rem;color:var(--muted);margin-top:1px}
.step.done .t{color:var(--muted)}
.step .ch{margin-left:auto;font-size:1.4rem;color:var(--muted)}.step.next .ch{color:var(--gold-ink)}
.cats.accs button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px}
.cats.accs button small{font-size:.75rem;font-weight:600;opacity:.75}
#eyebtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.priv .k{width:28px;height:28px;flex:none;display:grid;place-items:center;background:var(--gold-grad);color:#0B1020;font-weight:800;font-size:.8rem}
.btn.sm{padding:7px 12px;font-size:.84rem}
.btn.block{width:100%}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1;min-width:120px}

/* navigazione */

/* ETF */
function etfStats(e,upTo){const ops=e.ops.filter(o=>!upTo||o.date<=upTo).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);let qty=0,cost=0;
 for(const o of ops){if(o.set){qty=o.qty;cost=o.cost;continue}if(o.qty>0){qty+=o.qty;cost+=o.qty*o.price+(o.fee||0)}else{const q=Math.min(-o.qty,qty);const avg=qty?cost/qty:0;cost-=avg*q;qty-=q}}
 return{qty,cost:Math.max(0,cost)}}
const sortedHist=e=>(e.hist||[]).slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
function curPrice(e){if(e.kind==='bfp'&&e.bfp)return Math.round(bfpVal(e).lordo*100)/100;const h=sortedHist(e);if(h.length)return h[h.length-1].p;const o=e.ops.slice().sort((a,b)=>a.date<b.date?-1:1);return o.length?o[o.length-1].price:0}
function priceDate(e){if(e.kind==='bfp')return today();const h=sortedHist(e);return h.length?h[h.length-1].d:null}
function priceAt(e,d){let p=null;for(const x of sortedHist(e))if(x.d<=d)p=x.p;if(p==null)for(const o of e.ops.slice().sort((a,b)=>a.date<b.date?-1:1))if(o.date<=d)p=o.price;return p}
function etfRows(){return S.etfs.map((e,i)=>{const st=etfStats(e),p=curPrice(e),v=st.qty*p;return{e,st,p,v,g:v-st.cost,c:colorOf(i)}})}

function projDefault(){const from=iso(new Date(Date.now()-365*864e5));const v=Math.round(sum(S.movs.filter(m=>m.type==='inv'&&m.date>=from),m=>m.amount)/100)*100;return v>0?v:1200}
function coreEtf(){const r=etfRows();return(r.find(x=>x.e.role==='core')||r.sort((a,b)=>b.v-a.v)[0]||null)}
const lastOf=h=>{const s=(h||[]).slice().sort((a,b)=>a.d<b.d?-1:1);return s.length?s[s.length-1]:null};
function loanCalc(l){const P=+l.principal||0,n=Math.max(1,Math.round(+l.months||1)),r=(+l.tan||0)/1200;const rata=r?P*r/(1-Math.pow(1+r,-n)):P/n;const st=pd(l.start);const t=today();let res=P,paid=0,intLeft=0;const rows=[];
 for(let i=0;i<n;i++){const d=iso(addMonths(st,i));const it=res*r;const cap=rata-it;res=Math.max(0,res-cap);const isPaid=d<=t;if(isPaid)paid++;else intLeft+=it;rows.push({n:i+1,d,it,cap,res,paid:isPaid})}
 return{rata,rows,paid,n,residuo:paid?rows[paid-1].res:P,intTot:rata*n-P,intLeft,next:rows[paid]||null}}
function wealth(){const com=lastOf(S.cometa.hist);const etf=sum(etfRows(),x=>x.v);const debt=sum(S.loans,l=>loanCalc(l).residuo);let cash=0,cashD=null;

async function imageLines(file,page){const P=CP('LydiaWidget');if(!NATIVE()||!P||!P.ocr)throw new Error('Le foto le leggo nell\'app Android di Lydia. Qui carica il PDF');

 const k=Math.min(1,2400/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
 const data=cv.toDataURL('image/jpeg',.92).split(',')[1];const r=await P.ocr({data});const words=JSON.parse(r.words||'[]').filter(w=>w.t&&w.t.trim());if(!words.length)throw new Error('Nella foto non trovo testo: prova con più luce, dritta e a fuoco');
 const sc=595/r.w;const it=words.map(w=>({x:w.x*sc,x2:(w.x+w.w)*sc,y:(r.h-w.y-w.h/2)*sc,h:w.h*sc,s:w.t})).sort((a,b)=>b.y-a.y||a.x-b.x);const lines=[];

function insights(){const out=[],s=S.settings,W=wealth(),R=etfRows(),V=sum(R,x=>x.v);
 const add=(lv,title,text,action)=>out.push({lv,title,text,action});
 // liquidità
 const accTot=sum(s.acc,a=>a.amount),soglia=s.reserve+accTot;
 if(!(s.reserve>0))add('act','Imposta la riserva di emergenza','Tre domande veloci per sapere quanto tenere da parte prima di investire.',{label:'Calcola la riserva',fn:'reserve'});
 if(W.cashD&&s.reserve>0){const ex=W.cash-soglia;
  if(W.cash<s.reserve)add('bad','Riserva sotto la soglia',`Sul conto hai ${eur0(W.cash)}, sotto la riserva di ${eur0(s.reserve)}. Rimanda i prossimi acquisti finché non torni sopra.`);
  else if(ex>=s.minOrder){const core=coreEtf();let t=`Sul conto hai ${eur0(W.cash)}: tolta la riserva${accTot?' e gli accantonamenti':''} (${eur0(soglia)}) restano ${eur0(ex)}.`;
   if(core&&core.p){const q=Math.floor((ex-fee(ex))/core.p);const f=fee(q*core.p);t+=` A ${eur(core.p)} sono ${q} quote di ${core.e.ticker||core.e.name} per ${eur0(q*core.p)}, commissione circa ${eur(f)} (${pct(f/(q*core.p),2)}).`}
   add('act',`Puoi investire ${eur0(ex)}`,t+' Meglio un ordine con prezzo limite, tra le 10 e le 17.')}
  else if(ex>0)add('info','Poco da investire, per ora',`Oltre la riserva hai ${eur0(ex)}. Conviene aspettare di arrivare a ${eur0(s.minOrder)}: con ordini piccoli la commissione pesa di più (${pct(s.feeMin/Math.max(ex,1),1)}).`);
  if(!S.accounts.length&&daysSince(W.cashD)>30)add('info','Aggiorna il saldo del conto',`L'ultimo saldo è del ${fmtDate(W.cashD)}. Aggiornalo per avere consigli sull'eccedenza corretti.`,{label:'Aggiorna saldo',fn:'cash'});
  const old=S.accounts.filter(a=>a.setOn&&daysSince(a.setOn)>60);if(old.length)add('info','Controlla i saldi dei conti',`${old.map(a=>a.name).join(', ')}: l'ultima verifica con la banca è di oltre due mesi fa. Se il saldo non torna, correggilo.`,{label:'Gestisci conti',fn:'cash'})}
 else if(!W.cashD)add('info','Aggiungi i tuoi conti','Così vedi i saldi sempre aggiornati.',{label:'Aggiungi conti',fn:'cash'});
 // satellite
 // prezzi vecchi
 for(const x of R){const d=priceDate(x.e);if(d&&daysSince(d)>21)add('info',`Prezzo di ${x.e.ticker||x.e.name} da aggiornare`,`L'ultimo prezzo è del ${fmtDate(d)}. Aggiornalo per vedere il valore giusto.`,{label:'Aggiorna prezzo',fn:'etf:'+x.e.id})}
 // risparmio
 const lf=completeMonths();const k3=[0,1,2].map(i=>shiftK(lf,-i)),k12=[];for(let i=3;i<15;i++)k12.push(shiftK(lf,-i));
 const a3=agg(k3.flatMap(byMonth)),a12=agg(k12.flatMap(byMonth));
 if(a3.entrate&&a12.entrate){const t3=a3.risp/a3.entrate,t12=a12.risp/a12.entrate;
  if(t3<t12-.05)add('warn','Stai risparmiando meno del solito',`Negli ultimi 3 mesi hai messo da parte il ${pct(t3)} delle entrate, contro il ${pct(t12)} dei 12 mesi prima.`);
  else if(t3>=.2)add('good',`Risparmi il ${pct(t3)} delle entrate`,`Media degli ultimi 3 mesi completi${t3>t12?`, meglio del ${pct(t12)} dei 12 mesi prima`:''}. Sopra il 20% è un ottimo ritmo.`);
  else add('info',`Risparmi il ${pct(t3)} delle entrate`,`Negli ultimi 3 mesi, contro il ${pct(t12)} dell'anno prima. Molti puntano al 20%.`)}
 // categorie in crescita
 const lastCats=catSpend(byMonth(lf)),prevK=[1,2,3,4,5,6].map(i=>shiftK(lf,-i));
 const prevAvg={};for(const[c,v]of catSpend(prevK.flatMap(byMonth)))prevAvg[c]=v/6;
 const ups=lastCats.filter(([c,v])=>c!==S.settings.cardCat&&v-(prevAvg[c]||0)>80&&v>(prevAvg[c]||0)*1.4).slice(0,3);
 for(const[c,v]of ups)add('warn',`${c}: spesa in aumento`,`A ${monthLabel(lf)} ${eur0(v)}, di solito ${eur0(prevAvg[c]||0)} al mese.`);
 // budget
 for(const[c,b]of Object.entries(s.budgets||{})){if(!(b>0))continue;const v=sum(byMonth(curK()).filter(m=>m.type==='out'&&m.cat===c),m=>m.amount);if(v>b)add('bad',`Budget ${c} superato`,`Questo mese ${eur0(v)} su ${eur0(b)}.`);else if(v>b*.8)add('warn',`Budget ${c} quasi finito`,`Questo mese ${eur0(v)} su ${eur0(b)}.`)}
 // ricorrenti
 const subs=subscriptions();for(const x of subs){if(x.prev!=null&&x.amount>x.prev)add('warn',`${x.name}: è aumentato`,`Da ${eur(x.prev)} a ${eur(x.amount)} ${x.freq==='mese'?'al mese':"all'anno"}.`);else if(x.isNew)add('info',`Nuova spesa fissa: ${x.name}`,`${eur(x.amount)} ogni mese, circa ${eur0(x.year)} all'anno.`)}
 if(subs.length){const tot=sum(subs,x=>x.year);add('info',`Spese fisse: circa ${eur0(tot/12)} al mese`,subs.slice(0,6).map(r=>`${r.name} ${eur0(r.amount)}`).join(' · ')+'. Controlla ogni tanto se ti servono ancora tutte.')}
 // saldo carta senza categorie
 const l12=[];for(let i=0;i<12;i++)l12.push(shiftK(lf,-i));const sp12=catSpend(l12.flatMap(byMonth)),tot12=sum(sp12,x=>x[1]),card=S.settings.cardCat,amex=(sp12.find(x=>x[0]===card)||[0,0])[1];
 if(tot12&&amex/tot12>.25)add('info',`${card} è il ${pct(amex/tot12,0)} delle spese`,`Il saldo della carta arriva tutto insieme, senza categorie. Se vuoi grafici più precisi, registra a parte le spese grosse fatte con la carta.`);
 // busta senza accredito
 for(const p of S.payslips){const k=p.month,n=shiftK(k,1);const has=S.movs.some(m=>kind(m)==='stip'&&(m.date.startsWith(k)||m.date.startsWith(n)&&m.date.slice(8)<='10'));if(!has&&k>=shiftK(curK(),-3))add('act',`Accredito di ${monthLabel(k)} non registrato`,`Hai la busta paga da ${eur(p.netto)} ma nessun movimento Stipendio${p.rimborsi?`. Ricorda che ${eur(p.rimborsi)} sono rimborso spese`:''}.`,{label:'Registra accredito',fn:'sal:'+p.id})}
 // fondo pensione

const MAX_FILE=50*1024*1024;
async function unzipJSON(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;

const isZip=u=>u[0]===0x50&&u[1]===0x4B&&u[2]===3&&u[3]===4;

/* data e ora per i nomi dei file */
function stamp(){const d=new Date();return `${iso(d)}_${pad(d.getHours())}-${pad(d.getMinutes())}`}

/* ---------- blocco app: PIN e impronta ---------- */
async function pinHash(pin,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const BIO=()=>{const P=CP('LydiaWidget');return P&&P.biometric?P:null};
async function bioAvailable(){const P=BIO();if(!P||!P.bioAvailable)return false;try{const r=await P.bioAvailable();return!!(r&&r.ok)}catch(e){return false}}
async function bioAsk(){const P=BIO();if(!P)return false;try{const r=await P.biometric({title:'Sblocca Lydia',subtitle:'Usa l\'impronta o il volto'});return!!(r&&r.ok)}catch(e){return false}}
let locked=false,hiddenAt=0;
function lockScreen(){if(!S.settings.lock||!S.settings.lockHash||locked)return;locked=true;let pin='';let el=$('#lockscr');if(!el){el=document.createElement('div');el.id='lockscr';document.body.appendChild(el)}
 const draw=(msg)=>{el.innerHTML=`<div class="lkin">${LOGO(56)}<h2>Lydia è bloccata</h2><p class="note" id="lkmsg">${msg||'Inserisci il PIN'}</p><div class="lkdots">${[0,1,2,3,4,5].slice(0,Math.max(4,S.settings.lockLen||4)).map(i=>`<i class="${i<pin.length?'on':''}"></i>`).join('')}</div>
  <div class="lkpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button type="button" data-k="${n}">${n}</button>`).join('')}<button type="button" data-k="bio" class="lkbio" ${S.settings.lockBio&&BIO()?'':'style="visibility:hidden"'} aria-label="Impronta"><svg class="i" viewBox="0 0 24 24"><path d="M12 11v4M8.5 8.5a5 5 0 0 1 8.5 3.5v2M7 12v1a5 5 0 0 0 1 3M12 4a8 8 0 0 1 8 8v1M4 13v-1a8 8 0 0 1 4-7M15.5 15.5c-.3 1.6-1 3-2 4.2M10 15c0 2-.6 3.6-1.6 5"/></svg></button><button type="button" data-k="0">0</button><button type="button" data-k="del" aria-label="Cancella"><svg class="i" viewBox="0 0 24 24"><path d="M21 5H8l-6 7 6 7h13zM12 9l6 6M18 9l-6 6"/></svg></button></div>
  <button type="button" class="linkbtn" id="lkforgot" style="margin:14px auto 0">Ho dimenticato il PIN</button></div>`;
  el.querySelector('.lkpad').onclick=async e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k==='bio'){if(await bioAsk())unlock();return}if(k==='del'){pin=pin.slice(0,-1);draw();return}if(pin.length>=6)return;pin+=k;draw();
   if(pin.length>=(S.settings.lockLen||4)){const h=await pinHash(pin,S.settings.lockSalt);if(h===S.settings.lockHash)unlock();else{pin='';draw('PIN sbagliato, riprova');el.querySelector('.lkdots').classList.add('shake')}}};
  $('#lkforgot').onclick=()=>{draw('Senza PIN non posso aprire i dati: è il loro scopo. Puoi solo cancellare tutto e ripristinare un backup.');const b=document.createElement('button');b.className='btn danger';b.style.marginTop='12px';b.textContent='Cancella tutto e ricomincia';b.onclick=()=>{if(confirm('Cancellare tutti i dati di Lydia su questo telefono?')){localStorage.removeItem(KEY);location.reload()}};el.querySelector('.lkin').appendChild(b)}};
 const unlock=()=>{locked=false;el.classList.remove('open');setTimeout(()=>el.remove(),200)};
 draw();el.classList.add('open');if(S.settings.lockBio&&BIO())setTimeout(async()=>{if(locked&&await bioAsk())unlock()},350)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>60000)lockScreen()});
function lockSheet(){const st=S.settings;
 const draw=async()=>{const bio=await bioAvailable();sub('Blocco app',`<p class="note" style="margin-top:10px">Chiede un PIN quando apri Lydia o ci torni dopo un minuto. ${bio?'Puoi usare anche l\'impronta o il volto.':NATIVE()?'L\'impronta non è disponibile su questo telefono.':'L\'impronta funziona nell\'app Android.'}</p>
  ${st.lock?`<div class="kv" style="border:0"><span>Blocco</span><b class="pos">Attivo</b></div>${bio?`<label class="check"><input type="checkbox" id="lkbio" ${st.lockBio?'checked':''}> Sblocca anche con l'impronta</label>`:''}<div class="actions"><button class="btn ghost" id="lkchg">Cambia PIN</button><button class="btn danger" id="lkoff">Spegni</button></div>`
  :`<div class="actions"><button class="btn gold" id="lkon">Imposta un PIN</button></div>`}`,()=>{
   if($('#lkon'))$('#lkon').onclick=()=>setPin(bio);if($('#lkchg'))$('#lkchg').onclick=()=>setPin(bio);
   if($('#lkbio'))$('#lkbio').onchange=async e=>{if(e.target.checked&&!(await bioAsk())){e.target.checked=false;toast('Impronta non confermata');return}st.lockBio=e.target.checked;save()};
   if($('#lkoff'))$('#lkoff').onclick=async()=>{const p=prompt('Per spegnere il blocco scrivi il PIN');if(p==null)return;if(await pinHash(p,st.lockSalt)!==st.lockHash){toast('PIN sbagliato');return}st.lock=false;st.lockBio=false;delete st.lockHash;save();toast('Blocco spento');draw()}})};
 const setPin=bio=>{sub('Nuovo PIN',`<label class="f" style="margin-top:12px">PIN (da 4 a 6 cifre)<input id="lkp1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password"></label><label class="f">Ripeti il PIN<input id="lkp2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password"></label><p class="note">Se lo dimentichi, per riaprire Lydia dovrai cancellare i dati e ripristinare un backup.</p><div class="actions"><button class="btn gold" id="lksv">Salva PIN</button></div>`,()=>{
  setTimeout(()=>{try{$('#lkp1').focus()}catch(e){}},80);
  $('#lksv').onclick=async()=>{const a=$('#lkp1').value,b=$('#lkp2').value;if(!/^\d{4,6}$/.test(a)){toast('Il PIN deve avere da 4 a 6 cifre');return}if(a!==b){toast('I due PIN non sono uguali');return}
   const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(x=>x.toString(16).padStart(2,'0')).join('');st.lockSalt=salt;st.lockHash=await pinHash(a,salt);st.lockLen=a.length;st.lock=true;save();toast('PIN impostato');
   if(bio&&!st.lockBio&&await ask('Usare anche l\'impronta?','Più veloce del PIN. Il PIN resta per quando l\'impronta non funziona.','Sì')){if(await bioAsk()){st.lockBio=true;save()}}lockSheet()}})};
 draw()}

/* tastiera aperta: la finestra sale sopra la tastiera invece di finirci sotto */
{const R=document.documentElement;let base={},ft=0;const tf=e=>e&&e.matches&&e.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=range]),textarea,[contenteditable]');const chk=()=>{const w=innerWidth;const h=window.visualViewport?Math.min(innerHeight,visualViewport.height):innerHeight;if(!base[w]||h>base[w])base[w]=h;R.classList.toggle('kbopen',h<base[w]-120||(tf(document.activeElement)&&Date.now()-ft<700))};addEventListener('resize',chk);if(window.visualViewport)visualViewport.addEventListener('resize',chk);addEventListener('focusin',e=>{if(tf(e.target)){ft=Date.now();chk();setTimeout(chk,750)}});addEventListener('focusout',()=>setTimeout(chk,80));chk()}
if(window.visualViewport){const kb=()=>{const vv=visualViewport;const h=Math.max(0,Math.round(innerHeight-vv.height-vv.offsetTop));document.documentElement.style.setProperty('--kb',(h>60?h:0)+'px');if(h>60){const a=document.activeElement;if(a&&a.closest&&a.closest('#sheet'))setTimeout(()=>{try{a.scrollIntoView({block:'nearest'})}catch(e){}},60)}};visualViewport.addEventListener('resize',kb);visualViewport.addEventListener('scroll',kb)}
if(NATIVE()&&CP('App')){CP('App').addListener('appUrlOpen',e=>openLink(e&&e.url));CP('App').getLaunchUrl().then(r=>{if(r&&r.url)setTimeout(()=>openLink(r.url),300)}).catch(()=>{})}
if(NATIVE()&&CP('App'))CP('App').addListener('backButton',()=>{if($('#ov').classList.contains('open'))closeSheet();else if(tab!=='home')go('home');else CP('App').exitApp()});if(!quickFromHash(startHash))welcomeFlow();lockScreen();setTimeout(autoBackup,3000);
/* ridisegna i grafici solo se cambia la larghezza (la tastiera cambia solo l'altezza) e mai mentre stai scrivendo */
let lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{if(Math.abs(innerWidth-lastW)<2)return;const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;lastW=innerWidth;if(!$('#ov').classList.contains('open'))render()},250)});
loadSeed().then(sd=>{if(!sd)return;
 if(firstRun&&!S.movs.length){const keep=S.settings;S=norm(sd);for(const k of['privacyOk','seenVersion','since','backupEvery','reserveAsked'])S.settings[k]=keep[k];applyCurrency();migrateAccounts();save();applyTheme();render();toast('Caricato il tuo storico: '+S.movs.length+' movimenti')}
 else if((sd.rev||0)>(S.rev||0)){mergeSeed(sd);save();render();toast('Storico aggiornato',3000)}});
